; TruDataGuard.asi options (next to tru.exe). Delete this file to use the built-in defaults.
[DataGuard]
; 0 = load but patch nothing
Enabled=1
; 0 errors only, 1 info + the first hits + the first hit of each caller, 2 + every power of two, 3 every hit
LogLevel=1
; guard the section lookup tru+0x14df80 (ids >= 0x8000 / implausible records -> not found)
SectionLookup=1
; guard the section exists test tru+0x14df70
SectionExists=1
; 0 = callers that do not test the result for 0 get the original lookup (logged first); 1 = they get 0 as well
UncheckedCallers=0
; number of detailed hit lines before only the first hit per caller is logged
LogFirst=20
; 1 = name Lara's stream unit in hit lines
LogUnit=1
