; TruDlc2Player.asi options (next to tru.exe). Delete this file to use the built-in defaults.
[Dlc2Player]
; 0 = load but patch nothing
Enabled=1
; 0 errors only, 1 info (incl. one line per level load with the costume chosen), 2 + every new game tracker
LogLevel=1
; level load: costume lara_doppelganger -> doppelganger_casual, as the Xbox title update (needs TypeRecord=1)
Costume=1
; player type record "doppelganger_casual" (init DoppelgangerInit) appended to the type table
TypeRecord=1
; 0.2: every new game tracker (tru+0x31c2d0) clears the doppelganger flag, as the TU's new tracker (memset) does -
; without it the flag stays 1 after DLC 2 for the rest of the session (DLC 1 / main game then act as DLC 2)
FlagReset=1
