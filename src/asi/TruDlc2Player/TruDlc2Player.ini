; TruDlc2Player.asi options (next to tru.exe). Delete this file to use the built-in defaults.
[Dlc2Player]
; 0 = load but patch nothing
Enabled=1
; 0 errors only, 1 info (incl. one line per level load with the costume chosen), 2 + every new game tracker
LogLevel=1
; level load: costume lara_doppelganger -> doppelganger_casual, as the Xbox title update (needs TypeRecord=1)
Costume=1
; player type record "doppelganger_casual" (init DoppelgangerInit) appended to the type table
TypeRecord=1
; 0.2: every new game tracker (tru+0x31c2d0) clears the doppelganger flag, as the TU's new tracker (memset) does -
; without it the flag stays 1 after DLC 2 for the rest of the session (DLC 1 / main game then act as DLC 2)
FlagReset=1
; 0.3: a level load of the DLC 2 player costume (lara_doppelganger / doppelganger_casual) in a unit whose own default
; costume is not lara_doppelganger (DLC 1, main game) zeroes the chosen costume (+0x20c / +0x20e / +0x210) and loads the
; unit default - the outcome of the TU's mission start (new-game reset 0x821fe9a8), which a direct level change skips.
; Without it DLC 1 after DLC 2 (TruMenu level.load) plays as the doppelganger. Needs Costume=1 (same detour).
CostumeReset=1
; 0.4: DoppelgangerInit also stores the flag into the game tracker ([0xfadb58]+0x1244 = 1) as the TU (0x82412c84) - read
; by larabase f36 (the TU HUD script's shadow-meter block: red / pulse) and the player code tru+0x3200df. 0 = as 0.3
TrackerFlag=1

[Costume]
; 0.5: the TU's costume mapping 857 doppelganger_casual <-> 11 lara_doppelganger in state save / state load / both player
; spawns (TU 0x821ff0dc, 0x821ff518, 0x822976b0, 0x8229803c) - all four or none; a save in DLC 2 then holds 11 like the
; TU's. Needs TypeRecord=1 and Costume=1. 0 = as 0.4 (saves hold 857), nothing patched; every mapping is logged
TuMapping=0
