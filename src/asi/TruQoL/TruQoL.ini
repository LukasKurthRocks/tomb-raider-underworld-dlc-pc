; TruQoL.asi options (next to tru.exe). All keys are optional; the values below are the built-in defaults.
; Every feature has its own switch; the log TruQoL.log (next to tru.exe) has one line per feature: on / off / why.
; "live" = read again while the game runs (at most once a second after the file changed; TruMenu page Fixes writes
; here), "restart" = read once at the game start.
[TruQoL]
; 0 = load but patch nothing (restart)
Enabled=1
; 0 errors, 1 info (one line per feature), 2 also a frame-rate line every 10 s while the limiter runs (live)
LogLevel=1

[FrameLimit]
; 1 = cap the frame rate (the game's physics and cubes misbehave above 60 fps); 0 = the game's own frame rate (live)
Enabled=1
; frames per second, 20 .. 500 (live)
MaxFps=60
; 1 = switch the limiter off by itself when another one already caps the game: DXVK as d3d9.dll (its tru.exe
; profile limits to 60; d3d9.maxFrameRate in dxvk.conf or DXVK_FRAME_RATE are read) or dxwrapper with
; LimitPerFrameFPS > 0 (the GOG release); 0 = keep TruQoL's limiter in any case (two limiters: the lower one wins)
; (live: the check runs once when d3d9.dll is loaded, this key decides whether its result switches the limiter off)
AutoOff=1
; advanced: the last microseconds before a frame are waited in a short pause loop instead of sleeping
; (0 = automatic: 600 with a high-resolution timer, 2000 without); 0 .. 5000 (live)
SpinUs=0

[Camera]
; field of view as a factor on the game's own (vertical, per camera and per frame) value: 0 or 1 = the game's,
; 1.15 = 15 % wider, 0.8 = narrower; 0.5 .. 2.0. A factor, not degrees, because the game changes the angle itself
; (camera modes, aiming, cutscene keys) and that must keep working. (live)
Fov=0
; 0 = the factor applies only to the gameplay camera (cutscenes keep their framing); 1 = to every camera (live)
FovCutscenes=0
; camera shake strength: 1.0 = the game's own, 0.5 = half, 0 = no camera shakes (motion sickness); 0 .. 1.0 (live;
; below 1.0 TruQoL owns the two shake calls and TruMenu's cam.shakescale slider is refused, 1.0 gives them back)
ShakeScale=1.0

[Startup]
; start-up crash on PCs with more than 31 CPU threads: the game's CPU count is shown at most this many threads, so
; it ends correctly. Only acts when the PC reports more threads than the value (31 = only on PCs where the game would
; crash; no change elsewhere). 1 .. 31; 0 = off (the game's own count; work-around: start /affinity FFFF) (restart:
; the count runs once, before the game window opens)
ThreadCap=31
