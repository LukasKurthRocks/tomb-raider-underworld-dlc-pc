; TruTrace.asi options (next to tru.exe). Log only - nothing in the game changes. All keys are optional; the values
; below are the built-in defaults. Every category is on by default; 0 switches it off (its hooks are then not placed).
[Trace]
; 0 = load but hook nothing, no poll thread
Enabled=1
; 0 errors, 1 the diagnostic lines, 2 also every sound start / end, every chart change outside the teleport window
LogLevel=1
; rate limit per category (lines per second, lines in total); a suppressed count is logged
MaxLinesPerSecond=40
MaxLinesPerCategory=50000
; poll thread interval (ms): player position (teleport), object 858, unit name; the log is written every 100 ms
PollMs=5
; F5: sound starts (anim events, by id, wrappers), emitter ends, instance sound list release, slot stops
Sound=1
; an emitter still alive after this many ms gets one "sound LONG" line
SoundLiveMs=4000
; "sound REPEAT" when one instance starts the same sound this often within 10 s (0 = off)
SoundRepeat=3
; 0.3: object sound-slot play tru+0x193d50 (anim event type 0x60): owner instance, slot, mode, p3 / p4, emitter before /
; after; emitters started there carry "fixed slot N of <instance>" in their START / LONG / END lines (needs Sound=1)
SoundSlots=1
; F6: player position jump > TeleportUnits between two polls -> state before / after and follow-ups
Teleport=1
TeleportUnits=300
; chart changes of the player's machines are logged at level 1 for this long after a jump
TeleportWindowMs=3000
; F6: chart transition / reset / start hooks for the player's machines
Chart=1
; receivers of 0x1f4 / 0x1f5 (TruShadowPower's wake calls)
PowerMessages=1
; F4: intro / birth requests for objects whose name contains SpawnFilter (empty = every object)
Spawn=1
SpawnFilter=thrall
; NEU-4: object table entry of ObjectId (state, object, data type)
Object858=1
ObjectId=858
; F7: TimeVector (RenderDevice +0xfa4c / +0xfa48) every TimeVectorMs
TimeVector=1
TimeVectorMs=1000
; ---- 0.2 ----
; level change requests (name, doneType, caller), STREAM_LevelLoadAndInit (requested vs loaded unit), the player
; placement (game data checkpoint id -> which intro / position), moves into a new stream unit, gameTracker request bytes
Level=1
; stream portal hits (the player's at level 1, other instances at level 2)
Portal=1
; stream unit table: every slot load / unload / state change
StreamUnits=1
; SAVE_SaveGame (checkpoint reached / gameloop / placement) and SAVE_RestoreGame with the checkpoint fields, and every
; change of game data +0x10 unit / +0x90 / +0x114 checkpoint id / +0x1f4 mode in the active block and the checkpoint copy
Save=1
; instance births / removals / +0x14 +0x18 flag changes of objects whose name contains one of ProgressFilter
Progress=1
; INSTANCE_Post messages to such instances
Messages=1
; comma separated, case-insensitive substrings of object names (empty = every object)
ProgressFilter=checkpoint,breakwall,trigger,door,gate,lever,plate,switch,spawner
; changed byte ranges of the active save buffer every GameDataMs (a word that changes in 8 polls in a row is muted)
GameData=1
GameDataMs=250
