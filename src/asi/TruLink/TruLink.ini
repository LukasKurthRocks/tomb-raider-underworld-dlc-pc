; TruLink.asi options - put next to tru.exe together with TruLink.asi (optional; defaults below). See README.md.
[TruLink]
; 1 = start the 127.0.0.1 command server (default 1 in our test builds); 0 = load but do nothing
Enabled=1
; TCP port on 127.0.0.1 only (never all interfaces). 9264 is FMOD's profiler port and is refused.
Port=9265
; 0 errors, 1 info + every write / game-function call, 2 every command, 3 debug - TruLink.log next to tru.exe
LogLevel=1
; 1 = a trailing "force" lets read / write reach memory outside the tru.exe image and private memory (other DLLs,
; mapped files) and read-only pages outside the image; 0 = force is refused
AllowForce=1
; how long camera / post wait for the game thread (ms, at least 500)
GameThreadTimeoutMs=5000
; 0.3 memory search: most candidates a scan keeps (8 bytes each, committed on demand; 1024 .. 16777216)
ScanMaxCandidates=4194304
; a first scan stops after this many seconds (partial candidate set, the answer says STOPPED)
ScanMaxSeconds=60
; watch polling interval in ms (at least 20); changes go to TruLink.log and the watch log ring (1024 events)
WatchIntervalMs=100
