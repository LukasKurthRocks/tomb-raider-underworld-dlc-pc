[Arachno]
; 0.21 Arachnophobie (arachno.on): 1 = spiders replaced from the start - the master switch of Hide / Picture / Mute below;
; bar page Barrierefreiheit, menu Accessibility. Spiders = object names with a part of Match and none of Exclude
Enabled=0
; 0.21 (arachno.hide): 1 = the spider model is not drawn while Enabled (InstanceDrawable slot 7 0x853ad8, the draw-group mask
; +0x23c = -1 only during the spider's draw call); logic, collision, AI and Lara's aim stay; its shadow goes too
Hide=1
; 0.21 (arachno.picture): 1 = a picture at each spider while Enabled (size from its bones, wobbling, over walls / HUD until 0.22)
Picture=1
; 0.21 (arachno.mute): 1 = spider sounds are not started while Enabled (6 call gates + the sound-slot jump table word 0x5b6b1c)
Mute=1
; 0.21: comma list of object name parts that make a spider (a-z 0-9 _)
Match=spider,tarantula
; 0.21: comma list of name parts that are never a spider (the spider generators)
Exclude=_generator
; 0.21: the picture - a PNG (alpha, any size up to 8192) next to tru.exe or a full path; missing = a built-in picture.
; Your own image stays local: the installer never copies, overwrites or removes it
Image=TruMenu.arachno.png
; 0.21: picture size relative to the spider's projected bone box, 0.2 .. 5
Scale=1.0
; 0.21: smallest picture in pixels, 4 .. 256
MinPx=16
; 0.21: largest picture as a part of the screen height, 0.1 .. 1
MaxScreen=0.6
; 0.21: the picture fades out closer to the camera than this (units), 0 .. 2000 (0 = no fade)
FadeNear=150
; 0.21: no picture beyond this distance from the camera (units), 500 .. 50000
MaxDist=8000
; 0.21: bobbing of the picture as a part of its height, 0 .. 0.5
WobbleAmp=0.06
; 0.21: wobble speed in Hz, 0 .. 10
WobbleHz=1.6
; 0.21: squash / stretch, 0 .. 0.5
SquashAmp=0.08
; 0.21: tilting in degrees, 0 .. 45
TiltDeg=5
; 0.21: 1 = the picture is mirrored while its spider moves to the left on screen
Flip=1

