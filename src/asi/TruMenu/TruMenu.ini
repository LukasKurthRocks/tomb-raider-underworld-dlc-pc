; TruMenu.asi options - put next to tru.exe together with TruMenu.asi (optional; defaults below)
[Menu]
; 0 = load but hook nothing
Enabled=1
; 0 errors, 1 info, 2 every menu toggle / action, 3 debug - TruMenu.log next to tru.exe
LogLevel=1
; XInput buttons that open / close the menu together: 0x0040 L3 + 0x0080 R3 = 192 (0x00C0)
ToggleButtons=192
; keyboard key that also opens / closes the menu (virtual key code, e.g. 119 = F8); 0 = off
ToggleKey=0
; size of the menu (font and spacing), 0.5 .. 4
Scale=1.5
; 1 = show the Lara position overlay from the start
Overlay=0
; 1 = while the menu is open the mouse belongs to the menu: a cursor is drawn, the game gets no mouse messages (no camera
; turn, no re-centring) and its SetCursorPos / ClipCursor calls wait until the menu closes; 0 = as before 0.7
FreeMouse=1
; 1 = while the menu is open the game gets no keyboard: its DirectInput keyboard reads no key events (a key the game
; saw going down is released once, a key still held at the close stays away until released) and key messages go to
; the menu only; 0 = as 0.7 (pad: [Pad] BlockInput, mouse: FreeMouse)
BlockGameInput=1
; 1 = also pause the game time while the menu is open (time.pause: streamFlags bit 0x1000); on close the state
; from before the menu comes back (unless time.pause was used meanwhile)
PauseGame=0
; 0.10.3: 1 = while the world pause bit is on in a level and the ring did not set it (time.pause, PauseGame), the sound
; pauses too - the pause menu's own functions (0x5874b0 / 0x5874d0), not while the pause menu is open; item time.pausesound
; switches it until the next start, a changed value here is taken over within a second
PauseSound=0

[Pad]
; 1 = the game gets a neutral pad while the menu is open; 0 = the game sees the pad as well
BlockInput=1

[Cheat]
; 1 = show the experimental actions (cheat / flight, camera mode, level load, costumes, developer menu rows, time /
; player / instance / video items); 0 = read-only
Experimental=1
; flight: units per 30 fps frame at full trigger (RT up, LT down) while cheat mode is on
FlightSpeed=20

[Cheats]
; 0.8: 1 = the Cheats page (god mode, one-hit kill, enemy health, infinite ammo, fill 'er up, cheat codes) can switch;
; 0 = the page only lists them (also needs [Cheat] Experimental=1)
Enabled=1
; 0.8: 0 = every cheat starts off at each game start; 1 = the cheats switched on are kept in State below and switched
; on again in the first level of the next game start
Persist=0
; 0.8: written by TruMenu when Persist=1 (comma list of cheat ids that are on); empty = none
State=

[Levels]
; units offered as buttons on the Level select page (comma list)
List=dlc_level1_start,dlc_level2_start
; level.start: 1 = as the title update's mission menu: dlc_level2_start (and dlc_level4..6_start) start without the outfit /
; weapon selection, every other unit with it; 0 = as the PC mission menu (script 104): always with the selection
OutfitRule=1

[Log]
; 1 = log lines (Tru*.log tails, script prints) in the bottom-left corner from the start
Overlay=0
; lines on the Debug / Log page and in the overlay, 1 .. 64
Lines=12
; 1 = redirect the game's 8 script print / log natives to the log page from the start (patches 5 bytes each)
Script=0
; 1 = repeated lines (same source, same text after the time stamp) become one line "text x42 (17:09:02-17:09:33)"
Collapse=1
; 1 = drop TruLink's echo of read / scan / watch / ping commands and of menu reads (info items such as status.*,
; test.list) - the lines never enter the log page
HideLinkReads=1
; lines shown on the page / overlay: 0 all, 1 warnings and errors, 2 errors only
MinLevel=0
; at most this many new lines per source and second (more are dropped and counted); 0 = no limit
MaxLinesPerSecond=40
; 1 = a line "unit: <name> (was <name>)" when Lara moves into another stream unit (TruMenu.log, log page and overlay)
UnitChanges=1
; sources the corner overlay shows (comma list of log names: TruMenu, TruGuard, TruShadowPower, TruRockVein,
; TruLink, TruDlc2Player, script, ...); * = all. Overlay only - the log page and the log files stay complete
OverlaySources=TruMenu,TruGuard
; overlay only: lines holding one of these texts are not shown (comma list, e.g. activity 1009,markup subtest); empty = none
OverlayExclude=
; 0.8: 1 = a line "camera: mode A -> B" / "camera: object ..." when the camera manager's mode or current camera
; changes (polled a few times per second, read-only; TruMenu.log, log page and overlay)
CameraChanges=1
; 0.8.1: 1 = with LogLevel 2 one line per pad button edge, mouse click and key while the menu is open, with the source
; (XInput hook / Present fallback / window message) and what the menu did (focused widget, activated or why not);
; 0 = only the summary line at each menu close
InputTrace=1

[Favorites]
; item ids on the "Quick access / Favourites" page (comma list); empty = default list. Y on an item in the menu
; pins / unpins it and rewrites this line (TruLink: menu fav.add <id> / fav.del <id> / fav.list)
Ids=

[Cmd]
; 1 = command bar under the menu: type item ids as over TruLink without "menu" ("time.scale 0.5", "help"); the
; keyboard focus goes to it when the menu opens, D-pad / stick go on into the menu, View / F2 / Tab come back
Enabled=1
; commands kept in TruMenu.history.txt next to tru.exe (Up in the empty bar), 1 .. 64
HistorySize=32
; XInput button that puts the focus into the command bar and opens the on-screen keyboard while the menu is open
; (pressed and released alone, not as part of the open / close combo): 0x0040 L3 = 64; again = keyboard closed; 0 = off
FocusButton=64
; 1 = on-screen keyboard under the bar when the bar gets the focus by controller (FocusButton, A in the idle bar, View in
; the pad picker); a key on a real keyboard closes it again
Keyboard=1
; 1 = Up in the empty bar opens the history (Up older, Down newer); 0 = Up goes into the menu like Down (Ctrl + Up
; still opens the history)
UpOpensHistory=1
; 1 = the first D-pad / stick press in the bar only moves the focus into the menu; 0 = the same press also moves
; in the menu at once
FirstPadPressOnlyFocuses=1

[Test]
; test only: dlc2 (or dlc1) = once per game start, when the main menu is up, start that DLC the way the mission
; menu does (level.start, the intro plays); empty = off
AutoStart=
; seconds the main menu must be up before AutoStart starts the level, 1 .. 60
AutoStartDelay=3

[Regress]
; 0.8: list shown on the Regression page at start: dlc1, dlc2 or all (TruMenu.regress_dlc1.txt / _dlc2.txt next to
; the .asi; results go to TruMenu.regress_results.txt)
List=all

[Media]
; 0.9: 1 = media.music.play / stop also in a level; 0 = main menu only (until a live test proves play in a level safe)
MusicInLevels=0
; 0.9: fade in / out of media.music.play / stop in frames (30 per second; the game's unit start uses 60), 0 .. 300
MusicFade=60

[Saves]
; 0.9: save folder for the Saves page; empty = the game's own (Documents\Eidos\Tomb Raider - Underworld, as tru.exe
; 0x78b550). Backups, export and import live in TruMenu.saves next to tru.exe
Folder=

[Radial]
; 0.10: 1 = radial menu: hold HoldButtons for HoldMs - a ring of up to 8 entries from TruMenu.radial.txt next to tru.exe,
; how it is used says Mode; a short press opens TruMenu as before (at the release when
; HoldButtons = [Menu] ToggleButtons); 0 = TruMenu exactly as 0.9
Enabled=1
; 0.10.1: menu = the ring stays open after the open (L3 + R3 held / Key or MouseButton tapped), left stick / right stick /
; D-pad / mouse pick, only A / Enter / left click runs or opens a level, B / Backspace / right click = back, L3 + R3 / Key again
; closes, the game gets a neutral pad and no keys; wheel = the 0.10 ring (right stick picks, releasing the hold runs)
Mode=menu
; 0.10.1, Mode=menu: while the ring is open in a level: world (or 1) = time.pause (the whole world incl. enemies stops; the
; state from before comes back at the close unless time.pause was run meanwhile), player (or 2) = player.control 0 (restored at
; the close), 0 = nothing. Read again at every open (a TO TEST switch works at once)
Freeze=world
; 0.10.3: 1 = while Freeze=world holds the world (the ring set the pause bit), the sound pauses too ([Menu] PauseSound
; for every other pause); item time.freezesound switches it until the next start, a changed value here is taken over
; within a second
FreezeSound=0
; 0.10.4: 1 = while the world is frozen in a level (the ring's Freeze=world or time.pause / [Menu] PauseGame), the shader
; clock TimeVector holds too, the pause menu's own way (0x5bfdf0: dt 0, the accumulator RenderDevice +0xfa4c stays,
; so it goes on without a jump); item time.freezeclock switches it until the next start, a changed value here is
; taken over within a second
FreezeShaderClock=0
; 0.10.1, Mode=menu: 1 = built-in last sector "Spiel beenden" on the top level (not from TruMenu.radial.txt): A arms it
; (red, 10 s), A again or A held 1 s = game.quit; pointing away / B / closing disarms; 0 = hidden
QuitSector=1
; 0.10.1, Mode=menu: 1 = built-in top level "Tests": TO TEST rows, Regression lists, Prepare shortcuts, Schalter (TO TEST
; toggles) - the page functions - and Rundgang (TruMenu.tour.txt next to tru.exe); 0 = hidden
TestsLevel=1
; 0.10: XInput buttons held together for the radial menu (hex or decimal): 0x00C0 = L3 + R3; 0 = no pad hold (key / mouse only)
HoldButtons=0x00C0
; 0.10: milliseconds the buttons must be held (shorter = TruMenu), 100 .. 3000
HoldMs=500
; 0.10: keyboard key for the radial menu (virtual key code, hex or decimal; 0x78 = F9 - for a Steam Controller back
; button map it to that key in Steam Input; Mode=menu: a tap opens / closes, Mode=wheel: held); the game does not get
; this key while it is set; 0 = off
Key=0x78
; 0.10: mouse button for the radial menu (3 = middle, 4 / 5 = side buttons; as Key); the mouse direction picks the entry;
; 0 = off
MouseButton=0
; 0.10: 1 = the ring opens again at the level, page and entry of its last close; 0 = always at the top
RememberPosition=1
; 0.10, Mode=wheel only: 1 = the left stick still reaches the game while the ring is open (Lara can walk); 0 = neutral pad
; (Mode=menu: always neutral - the left stick picks)
PassLeftStick=1
; 0.10: time.scale while the ring is open (e.g. 0.25; the value from before comes back at the close); 0 = off
SlowMotion=0
; 0.10: stick deflection (0.2 .. 0.95 of full) that picks an entry; inside it the centre (Mode=wheel: no entry, release = cancel;
; Mode=menu: the pick stays)
Deadzone=0.5
; 0.10: size of the ring relative to the back-buffer height, 0.5 .. 2
Scale=1.0
; 0.10 stage R2: 1 = instance.spawn <object> works (ring level Spieler/Objekte since 0.10.5, command bar): the object is loaded and born at
; Lara on the game thread (experimental - back up the saves first); 0 = refused. Read again while the game runs (a TO TEST switch works at once)
Spawn=0

[Shot]
; 0.10.5: 1 = screenshots on request only: item shot.save [ui|clean] [name] (command bar, TruLink "menu shot.save <name>"),
; ring Spieler / Screenshot, the ring level Claude (claude.mark: a TruMenu.log line + a clean shot each), Hotkey, the exports
; TruMenuShot / TruMenuMark of other plugins; nothing is taken automatically; 0 = every shot refused (claude.mark lines are still
; written, with shot=-)
Enabled=1
; 0.10.5: folder for the PNG files; empty = TruShots next to tru.exe, a relative path is below the game folder. File name
; shot_<HHMMSS>_<first open TO TEST step or ->_<name>.png; one TruMenu.log line "shot: <path> <w>x<h> <bytes> bytes, capture ... ms" per file
Folder=
; 0.10.5: 1 = the back buffer is copied before TruMenu draws (no menu, ring, command bar or TruMenu overlay in the shot);
; 0 = after it (as on screen). shot.save ui / clean overrides it per shot; claude.mark is always clean
Clean=1
; 0.10.5: keyboard key (virtual key code, hex or decimal; 0x7A = F11) = claude.mark now (a mark line + a clean shot);
; the game still gets the key; 0 = off
Hotkey=0
; 0.10.5: at most this many shots - and as many claude.mark lines - per minute, 1 .. 120; more are refused with a log line;
; 0 = no limit
MaxPerMinute=30

[Flow]
; 0.11: 1 = Ablauf: read the flow file below (steps, counters; Invoke-TruTestRun.ps1 installs a profile's flowFile) - the ring level
; Claude shows Weiter / Ueberspringen / Zurueck, Gut / Fehler set the step result, 'flow: ...' lines go to TruMenu.log; 0 = off (no file read,
; no tail, the flow.* items answer 'no flow')
Enabled=0
; 0.11: flow file next to tru.exe (a relative name) or an absolute path
File=TruMenu.flow.txt
; 0.11: 1 = the status line 'Claude-Ablauf  Schritt n/m | <counter a/b> | naechster: ...' in Claude's coral in a screen corner while a flow
; is loaded; 0 = only in the ring
Overlay=1
; 0.11: corner of the status line: tl, tr, bl, br (top / bottom, left / right)
Position=br
; 0.11: text size of the status line and the flow.say toast, 0.5 .. 3
Size=1.0
; 0.11: lines of the status line: 1 = step / counter / next, 2 = + the current step's text, 3 = + what it waits for / its hint
Lines=2
; 0.11: 1 = a step finished by its check= / fail= / its commands moves the flow on to the next step; 0 = only Weiter /
; Gut / Fehler / Ueberspringen move on
AutoAdvance=1
; 0.11: seconds a flow.say toast (TruLink: menu flow.say <text>) stays, 1 .. 30
ToastSeconds=6
; 0.11: milliseconds between two reads of the log files the flow's patterns name (every new byte, at most 256 KB per
; file and read), 100 .. 5000
PollMs=500
