; TruMenu.asi options - put next to tru.exe together with TruMenu.asi (optional; defaults below)
[Menu]
; 0 = load but hook nothing
Enabled=1
; 0 errors, 1 info, 2 every menu toggle / action, 3 debug - TruMenu.log next to tru.exe
LogLevel=1
; XInput buttons that open / close the menu together: 0x0040 L3 + 0x0080 R3 = 192 (0x00C0)
ToggleButtons=192
; keyboard key that also opens / closes the menu (virtual key code, e.g. 119 = F8); 0 = off
ToggleKey=0
; size of the menu (font and spacing), 0.5 .. 4
Scale=1.5
; 1 = show the Lara position overlay from the start
Overlay=0
; 0.18 (overlay.larain): 1 = the position overlay has a second line 'Lara in: <trigger> <id>' (up to 3, then +N, each in the
; colour of its kind) - computed every 100 ms whether a trigger layer is drawn or not; 0 = coordinates only
OverlayLaraIn=1
; 1 = while the menu is open the mouse belongs to the menu: a cursor is drawn, the game gets no mouse messages (no camera
; turn, no re-centring) and its SetCursorPos / ClipCursor calls wait until the menu closes; 0 = as before 0.7
FreeMouse=1
; 0.21.1 (menu.hidecursor): 1 = no mouse cursor over the game picture while the menu is closed (WM_SETCURSOR in the
; client area answered with none - for pad play; the game memory is not touched); 0 = the game's cursor as before
HideCursor=0
; 1 = while the menu is open the game gets no keyboard: its DirectInput keyboard reads no key events (a key the game
; saw going down is released once, a key still held at the close stays away until released) and key messages go to
; the menu only; 0 = as 0.7 (pad: [Pad] BlockInput, mouse: FreeMouse)
BlockGameInput=1
; 1 = also pause the game time while the menu is open (time.pause: streamFlags bit 0x1000); on close the state
; from before the menu comes back (unless time.pause was used meanwhile)
PauseGame=0
; 0.10.3: 1 = while the world pause bit is on in a level and the ring did not set it (time.pause, PauseGame), the sound
; pauses too - the pause menu's own functions (0x5874b0 / 0x5874d0), not while the pause menu is open; item time.pausesound
; switches it until the next start, a changed value here is taken over within a second
PauseSound=0

[Pad]
; 1 = the game gets a neutral pad while the menu is open; 0 = the game sees the pad as well
BlockInput=1

[Cheat]
; 1 = show the experimental actions (cheat / flight, camera mode, level load, costumes, developer menu rows, time /
; player / instance / video items); 0 = read-only
Experimental=1
; flight: units per 30 fps frame at full trigger (RT up, LT down) while cheat mode is on
FlightSpeed=20
; 0.21.6: 1 = while flight is on and the menu is closed, one line bottom right names the keys (RT up, LT down,
; stick moves, the speed); 0 = no line
FlightHint=1

[Cheats]
; 0.8: 1 = the Cheats page (god mode, one-hit kill, enemy health, infinite ammo, fill 'er up, cheat codes) can switch;
; 0 = the page only lists them (also needs [Cheat] Experimental=1)
Enabled=1
; 0.8: 0 = every cheat starts off at each game start; 1 = the cheats switched on are kept in State below and switched
; on again in the first level of the next game start
Persist=0
; 0.8: written by TruMenu when Persist=1 (comma list of cheat ids that are on); empty = none
State=

[Levels]
; units offered as buttons on the Level select page (comma list)
List=dlc_level1_start,dlc_level2_start
; level.start: 1 = as the title update's mission menu: dlc_level2_start (and dlc_level4..6_start) start without the outfit /
; weapon selection, every other unit with it; 0 = as the PC mission menu (script 104): always with the selection
OutfitRule=1

[Log]
; 1 = log lines (Tru*.log tails, script prints) in the bottom-left corner from the start
Overlay=0
; lines on the Debug / Log page and in the overlay, 1 .. 64
Lines=12
; 1 = redirect the game's 8 script print / log natives to the log page from the start (patches 5 bytes each)
Script=0
; 0.16 (log.scriptfile): 1 = the script lines (needs Script / log.script) also as 'script: ...' in TruMenu.log, at most
; MaxLinesPerSecond per second, a line repeated at once counted instead of written again; 0 = log page only
ScriptToFile=0
; 1 = repeated lines (same source, same text after the time stamp) become one line "text x42 (17:09:02-17:09:33)"
Collapse=1
; 1 = drop TruLink's echo of read / scan / watch / ping commands and of menu reads (info items such as status.*,
; test.list) - the lines never enter the log page
HideLinkReads=1
; lines shown on the page / overlay: 0 all, 1 warnings and errors, 2 errors only
MinLevel=0
; at most this many new lines per source and second (more are dropped and counted); 0 = no limit
MaxLinesPerSecond=40
; 1 = a line "unit: <name> (was <name>)" when Lara moves into another stream unit (TruMenu.log, log page and overlay)
UnitChanges=1
; sources the corner overlay shows (comma list of log names: TruMenu, TruGuard, TruShadowPower, TruRockVein,
; TruLink, TruDlc2Player, script, ...); * = all. Overlay only - the log page and the log files stay complete
OverlaySources=TruMenu,TruGuard
; overlay only: lines holding one of these texts are not shown (comma list, e.g. activity 1009,markup subtest); empty = none
OverlayExclude=
; 0.8: 1 = a line "camera: mode A -> B" / "camera: object ..." when the camera manager's mode or current camera
; changes (polled a few times per second, read-only; TruMenu.log, log page and overlay)
CameraChanges=1
; 0.8.1: 1 = with LogLevel 2 one line per pad button edge, mouse click and key while the menu is open, with the source
; (XInput hook / Present fallback / window message) and what the menu did (focused widget, activated or why not);
; 0 = only the summary line at each menu close
InputTrace=1

[Favorites]
; item ids on the "Quick access / Favourites" page (comma list); empty = default list. Y on an item in the menu
; pins / unpins it and rewrites this line (TruLink: menu fav.add <id> / fav.del <id> / fav.list). 0.21.8: an entry may be
; <id>|<argument> (a bar row with an argument, e.g. sw.set|TruRockVein:SweepAndPrune:Translate, costume.set|25)
Ids=

[Cmd]
; 1 = command bar under the menu: type item ids as over TruLink without "menu" ("time.scale 0.5", "help"); the
; keyboard focus goes to it when the menu opens, D-pad / stick go on into the menu, View / F2 / Tab come back
Enabled=1
; commands kept in TruMenu.history.txt next to tru.exe (Up in the empty bar), 1 .. 64
HistorySize=32
; XInput button that puts the focus into the command bar and opens the on-screen keyboard while the menu is open
; (pressed and released alone, not as part of the open / close combo): 0x0040 L3 = 64; again = keyboard closed; 0 = off
FocusButton=64
; 1 = on-screen keyboard under the bar when the bar gets the focus by controller (FocusButton, A in the idle bar, View in
; the pad picker); a key on a real keyboard closes it again
Keyboard=1
; 1 = Up in the empty bar opens the history (Up older, Down newer); 0 = Up goes into the menu like Down (Ctrl + Up
; still opens the history)
UpOpensHistory=1
; 1 = the first D-pad / stick press in the bar only moves the focus into the menu; 0 = the same press also moves
; in the menu at once
FirstPadPressOnlyFocuses=1

[Test]
; test only: dlc2 (or dlc1) = once per game start, when the main menu is up, start that DLC the way the mission
; menu does (level.start, the intro plays); empty = off
AutoStart=
; seconds the main menu must be up before AutoStart starts the level, 1 .. 60
AutoStartDelay=3

[Regress]
; 0.8: list shown on the Regression page at start: dlc1, dlc2 or all (TruMenu.regress_dlc1.txt / _dlc2.txt next to
; the .asi; results go to TruMenu.regress_results.txt)
List=all

[Media]
; 0.9: 1 = media.music.play / stop also in a level; 0 = main menu only (until a live test proves play in a level safe)
MusicInLevels=0
; 0.9: fade in / out of media.music.play / stop in frames (30 per second; the game's unit start uses 60), 0 .. 300
MusicFade=60
; 0.20 (media.mutemusic): 1 = background music muted from the start. 0.20.1: the FMOD channel groups of the music
; groups are muted (FMOD's own setMute) - no volume and not the option slider is changed; muted again after a level
; load; off = unmuted. Fallback when that code differs: SOUND_SetMusicVolume 0x589520(0) as in 0.20
MuteMusic=0
; 0.20 (media.muteambient): 1 = ambience beds played as music ('_amb_' tracks, DLC 2) stopped whenever they start;
; not covered: base-game ambience in sound groups (group index not known yet), effect sounds
MuteAmbient=0

[Saves]
; 0.9: save folder for the Saves page; empty = the game's own (Documents\Eidos\Tomb Raider - Underworld, as tru.exe
; 0x78b550). Backups, export and import live in TruMenu.saves next to tru.exe
Folder=
; 0.18 (save.load): 1 = a save of the game's list can be loaded from TruMenu (menu Saves page, quick-toggle bar page
; Saves; twice within 10 s, never over TruLink) - the game's own load step table 0x789de0, in a level only; 0 = refused
DirectLoad=1

[Radial]
; 0.10: 1 = radial menu: hold HoldButtons for HoldMs - a ring of up to 8 entries from TruMenu.radial.txt next to tru.exe,
; how it is used says Mode; a short press opens TruMenu as before (at the release when
; HoldButtons = [Menu] ToggleButtons); 0 = TruMenu exactly as 0.9
Enabled=1
; 0.10.1: menu = the ring stays open after the open (L3 + R3 held / Key or MouseButton tapped), left stick / right stick /
; D-pad / mouse pick, only A / Enter / left click runs or opens a level, B / Backspace / right click = back, L3 + R3 / Key again
; closes, the game gets a neutral pad and no keys; wheel = the 0.10 ring (right stick picks, releasing the hold runs)
Mode=menu
; 0.10.1, Mode=menu: while the ring is open in a level: world (or 1) = time.pause (the whole world incl. enemies stops; the
; state from before comes back at the close unless time.pause was run meanwhile), player (or 2) = player.control 0 (restored at
; the close), 0 = nothing. Read again at every open (a TO TEST switch works at once)
Freeze=world
; 0.10.3: 1 = while Freeze=world holds the world (the ring set the pause bit), the sound pauses too ([Menu] PauseSound
; for every other pause); item time.freezesound switches it until the next start, a changed value here is taken over
; within a second
FreezeSound=0
; 0.10.4: 1 = while the world is frozen in a level (the ring's Freeze=world or time.pause / [Menu] PauseGame), the shader
; clock TimeVector holds too, the pause menu's own way (0x5bfdf0: dt 0, the accumulator RenderDevice +0xfa4c stays,
; so it goes on without a jump); item time.freezeclock switches it until the next start, a changed value here is
; taken over within a second
FreezeShaderClock=0
; 0.10.1, Mode=menu: 1 = built-in last sector "Spiel beenden" on the top level (not from TruMenu.radial.txt): A arms it
; (red, 10 s), A again or A held 1 s = game.quit; pointing away / B / closing disarms; 0 = hidden
QuitSector=1
; 0.10.1, Mode=menu: 1 = built-in top level "Tests": TO TEST rows, Regression lists, Prepare shortcuts, Schalter (TO TEST
; toggles) - the page functions - and Rundgang (TruMenu.tour.txt next to tru.exe); 0 = hidden
TestsLevel=1
; 0.10: XInput buttons held together for the radial menu (hex or decimal): 0x00C0 = L3 + R3; 0 = no pad hold (key / mouse only)
HoldButtons=0x00C0
; 0.10: milliseconds the buttons must be held (shorter = TruMenu), 100 .. 3000
HoldMs=500
; 0.10: keyboard key for the radial menu (virtual key code, hex or decimal; 0x78 = F9 - for a Steam Controller back
; button map it to that key in Steam Input; Mode=menu: a tap opens / closes, Mode=wheel: held); the game does not get
; this key while it is set; 0 = off
Key=0x78
; 0.10: mouse button for the radial menu (3 = middle, 4 / 5 = side buttons; as Key); the mouse direction picks the entry;
; 0 = off
MouseButton=0
; 0.10: 1 = the ring opens again at the level, page and entry of its last close; 0 = always at the top
RememberPosition=1
; 0.10, Mode=wheel only: 1 = the left stick still reaches the game while the ring is open (Lara can walk); 0 = neutral pad
; (Mode=menu: always neutral - the left stick picks)
PassLeftStick=1
; 0.10: time.scale while the ring is open (e.g. 0.25; the value from before comes back at the close); 0 = off
SlowMotion=0
; 0.10: stick deflection (0.2 .. 0.95 of full) that picks an entry; inside it the centre (Mode=wheel: no entry, release = cancel;
; Mode=menu: the pick stays)
Deadzone=0.5
; 0.10: size of the ring relative to the back-buffer height, 0.5 .. 2
Scale=1.0
; 0.10 stage R2: 1 = instance.spawn <object> works (ring level Spieler/Objekte since 0.10.5, command bar): the object is loaded and born at
; Lara on the game thread (experimental - back up the saves first); 0 = refused. Read again while the game runs (a TO TEST switch works at once)
Spawn=0

[Shot]
; 0.10.5: 1 = screenshots on request only: item shot.save [ui|clean] [name] (command bar, TruLink "menu shot.save <name>"),
; ring Spieler / Screenshot, the ring level Claude (claude.mark: a TruMenu.log line + a clean shot each), Hotkey, the exports
; TruMenuShot / TruMenuMark of other plugins; nothing is taken automatically; 0 = every shot refused (claude.mark lines are still
; written, with shot=-)
Enabled=1
; 0.10.5: folder for the PNG files; empty = TruShots next to tru.exe, a relative path is below the game folder. File name
; shot_<HHMMSS>_<first open TO TEST step or ->_<name>.png; one TruMenu.log line "shot: <path> <w>x<h> <bytes> bytes, capture ... ms" per file
Folder=
; 0.10.5: 1 = the back buffer is copied before TruMenu draws (no menu, ring, command bar or TruMenu overlay in the shot);
; 0 = after it (as on screen). shot.save ui / clean overrides it per shot; claude.mark is always clean
Clean=1
; 0.10.5: keyboard key (virtual key code, hex or decimal; 0x7A = F11) = claude.mark now (a mark line + a clean shot);
; the game still gets the key; 0 = off
Hotkey=0
; 0.10.5: at most this many shots - and as many claude.mark lines - per minute, 1 .. 120; more are refused with a log line;
; 0 = no limit
MaxPerMinute=30
; 0.17 (shot.oncine): 1 = when a cutscene starts in a level, pairs of shots - a clean one and one with TruMenu (debug
; view, legend) of the same frame, shot_<HHMMSS>_<step>_cine<NN>_<i>_clean / _ui.png; the cutscene ends when the signal has
; been gone for 2 s; pairs have their own MaxPerMinute window; 0 = off
OnCine=0
; 0.17: at most this many shot pairs per cutscene (0.18: per segment), 1 .. 50
OnCinePairs=10
; 0.17: the first pairs of a cutscene (0.18: of a segment) come every OnCineIntervalMs, the rest every OnCineSlowMs, 1 .. 50
OnCineFastPairs=4
; 0.17: milliseconds between the first pairs, 250 .. 10000
OnCineIntervalMs=1500
; 0.17: milliseconds between the later pairs, 250 .. 60000 (0.18: 8000, was 5000 - spread over long cutscenes)
OnCineSlowMs=8000
; 0.18: 1 = a running cutscene starts a new segment (own pair budget, own log lines) when Lara's unit changes, the
; game's cinematic object changes or a script prints 'StartCinematic called' / 'Cine about to play' (needs
; log.script); 0 = one budget per cutscene (0.17); 0.20: a track change of the same cinematic is no new segment
OnCineSegments=1
; 0.17: what counts as a cutscene - cine = the game's cinematic test (0x453f00), camera = the current camera is not the
; gameplay camera [0xe804f0+0xb80], both = either of them
OnCineSignal=both

[Flow]
; 0.11: 1 = Ablauf: read the flow file below (steps, counters; Invoke-TruTestRun.ps1 installs a profile's flowFile) - the ring level
; Claude shows Weiter / Ueberspringen / Zurueck, Gut / Fehler set the step result, 'flow: ...' lines go to TruMenu.log; 0 = off (no file read,
; no tail, the flow.* items answer 'no flow')
Enabled=0
; 0.11: flow file next to tru.exe (a relative name) or an absolute path
File=TruMenu.flow.txt
; 0.11: 1 = the status line 'Claude-Ablauf  Schritt n/m | <counter a/b> | naechster: ...' in Claude's coral in a screen corner while a flow
; is loaded; 0 = only in the ring
Overlay=1
; 0.11: corner of the status line: tl, tr, bl, br (top / bottom, left / right)
Position=br
; 0.11: text size of the status line and the flow.say toast, 0.5 .. 3
Size=1.0
; 0.11: lines of the status line: 1 = step / counter / next, 2 = + the current step's text, 3 = + what it waits for / its hint
Lines=2
; 0.11: 1 = a step finished by its check= / fail= / its commands moves the flow on to the next step; 0 = only Weiter /
; Gut / Fehler / Ueberspringen move on
AutoAdvance=1
; 0.11: seconds a flow.say toast (TruLink: menu flow.say <text>) stays, 1 .. 30
ToastSeconds=6
; 0.11: milliseconds between two reads of the log files the flow's patterns name (every new byte, at most 256 KB per
; file and read), 100 .. 5000
PollMs=500

[Debug]
; 0.12: 1 = Debug-Zeichnung: the items nav.draw / nav.mask / nav.off (ring Spieler / Debug, command bar, TruLink) may switch
; the NavPower debug drawing compiled into tru.exe (data bytes only, in a loaded level, never while loading); 0 = off (the ring
; entries are greyed, nav.status still reads)
Enabled=0
; 0.12: comma list of NavPower switches turned on once the first level is loaded (needs Enabled=1), e.g. planner_areas;
; empty = none. Names: planner_areas, planner_areas_solid, planner_connectivity, planner_area_normals, obstacles,
; recent_navprobes, draw_mover3d_path
NavDraw=
; 0.12: 1 = together with NavDraw also nav.mask 1 (planner layer mask [0x88e454] = 0xffffffff: every layer is drawn);
; 0 = the game's mask
NavMask=0
; 0.21.7: 1 = navmesh labels on from the start (nav.labels): layer / graph / area number and the flag bits the engine
; colours by, at the areas of the drawn layers near Lara, plus the colour legend (read only)
NavLabels=0
; 0.21.7: navmesh labels only up to this distance from Lara to the area centre (game units, 500 .. 30000)
NavLabelRadius=3000
; 0.21.7: at most this many navmesh labels, the nearest first, 1 .. 64
NavLabelMax=40
; 0.21.7: 1 = read the SweepAndPrune pool of the markup collision every 250 ms (boxes / pair links / proxies,
; peaks, full frames; sap.status, a log line per new peak); 0 = off
SapWatch=1
; 0.13: 1 = Thrall-Labels on from the start (needs Enabled=1; item dbg.labels, ring Spieler / Debug): a text label at each
; thrall near Lara - name, intro id, distance, health, targeter 9 / hit list / condition 2011 from TruShadowCombat 0.5.3
; (read-only, in a loaded level only); 0 = off
Labels=0
; 0.13: labels only for instances at most this far from Lara (game units, 100 .. 50000)
LabelRadius=3000
; 0.13: at most this many labels, the nearest first (thralls before other matches), 1 .. 32
LabelMax=12
; 0.13: comma list of parts of object names that get a label, e.g. thrall,yeti; * = every instance in the radius
LabelMatch=thrall
; 0.13: 1 = a magenta cross at Lara's position (+0x20) projected the same way - the live check of the projection; 0 = none
LabelCross=1
; 0.21.7: 1 = uber labels on from the start (dbg.uber): gates / platforms / switches near Lara with their state
; and the time left ("Tor: oben, noch 12 s"); read only
UberLabels=0
; 0.21.7: uber labels only up to this distance from Lara (game units, 500 .. 50000; live 2026-11-07 the
; dlc_caverns_hall gates stood 3165 / 3357 units away - beyond LabelRadius 3000)
UberRadius=8000
; 0.21.7: at most this many uber labels, the nearest first, 1 .. 32
UberMax=12
; 0.21.7: comma list of object name parts that get an uber label without an uber state too (switches);
; empty = uber states only
UberMatch=switch,lever
; 0.14: 1 = the whole debug view on from the start (dbg.view: every layer below, Labels, Markup, and ViewNav as NavDraw when
; NavDraw is empty; needs Enabled=1); 0 = only the single keys
View=0
; 0.14: the NavPower switches dbg.view turns on (comma list, names as NavDraw)
ViewNav=planner_areas,planner_connectivity,obstacles
; 0.14: 1 = every trigger kind on from the start (dbg.triggers; wireframes of the game's trigger planes / volumes)
Triggers=0
; 0.14: 1 = trigger kind death / kill on from the start (red; dbg.show death)
TrgDeath=0
; 0.14: 1 = trigger kind fire / slow fire on from the start (orange; dbg.show fire)
TrgFire=0
; 0.14: 1 = checkpoint triggers on from the start (green; dbg.show checkpoint)
TrgCheckpoint=0
; 0.14: 1 = water triggers on from the start (blue; dbg.show water)
TrgWater=0
; 0.14: 1 = sound / swoosh triggers on from the start (violet; dbg.show sound)
TrgSound=0
; 0.14: 1 = plain trigger volumes on from the start (yellow; dbg.show volume)
TrgVolume=0
; 0.14: 1 = plain trigger planes on from the start (cyan; dbg.show plane)
TrgPlane=0
; 0.14: 1 = triggers of unknown kind on from the start (grey; dbg.show unknown)
TrgUnknown=0
; 0.14: 1 = loading areas (stream portal quads of the loaded units) on from the start (white; dbg.portals)
Portals=0
; 0.14: 1 = checkpoint objects on from the start (light green, the active one yellow; dbg.checkpoints)
Checkpoints=0
; 0.14: 1 = trigger names (object name, intro id, shape) on from the start (dbg.show trglabels)
TrgLabels=0
; 0.14: 1 = the legend top right on from the start (dbg.legend)
Legend=0
; 0.14: 1 = draw.markup on from the start
Markup=0
; 0.14: at most this many triggers drawn per frame, the nearest to the camera first, 1 .. 512 (0.16: 256, was 64 - a corridor of
; the manor has 98; the legend shows GEKAPPT / capped when the cap is hit)
TriggerMax=256
; 0.14: triggers only up to this distance from the camera (game units, 500 .. 200000)
TriggerRadius=20000
; 0.14: at most this many trigger names per frame (the nearest), 0 .. 64
TriggerLabelMax=16
; 0.14: 1 = object names on from the start (dbg.names: the object name of every instance from the live object list)
Names=0
; 0.14: object names only for names containing one of these parts (comma list a-z 0-9 _, e.g. thrall); empty or * = every
; instance
NameMatch=
; 0.14: object names only up to this distance from the camera (game units, 100 .. 200000)
NameRadius=5000
; 0.14: at most this many object names per frame, the nearest to the camera first, 1 .. 64
NameMax=24
; 0.14: font size factor of the object names, 0.5 .. 3
NameScale=1.0
; 0.14: colour of the object names, RRGGBB (ring presets: white FFFFFF, yellow FFE040, cyan 40E8FF, magenta FF50FF)
NameColour=FFFFFF
; 0.14: 1 = the intro id after each object name; 0 = the name only
NameIds=1
; 0.14: 1 = every debug view switch (layers, Labels, Markup, NavDraw) is written back into this file at once, so the
; chosen set comes back at the next start (Set-TruMenu.ps1 then keeps the file as owner-edited); 0 = switches
; last until the game ends
Persist=0
; 0.15: 1 = slide faces on from the start (dbg.slide): collision faces with clientFlags 0x04 of the loaded units, red =
; steeper than the tuning angle (Lara slides there), orange = flatter; drawn on top (also through walls)
Slide=0
; 0.15: 1 = enemy-only collision on from the start (dbg.enemycoll): faces of TerrainGroups with extra flags 0x800, violet
EnemyColl=0
; 0.15: slide / enemy collision faces only up to this distance from the camera (game units, 500 .. 200000)
CollRadius=8000
; 0.15: at most this many collision faces per frame, the nearest to the camera first, 100 .. 20000
CollMax=3000
; 0.15 stage R0: 1 = one render census in the first loaded level (dbg.census): CensusFrames frames of drawable /
; device draw counts per pass id, then one block of '0.15 census' lines in TruMenu.log with a suggested FlatPasses
Census=0
; 0.15: frames one render census counts, 10 .. 1200
CensusFrames=120
; 0.15 stage R1: 1 = flat view on from the start (dbg.flat): the level geometry in solid palette colours without
; textures - pixel shader swap inside the terrain / model draws of FlatPasses; while it is on in a level TruMenu patches
; 2 vtable words of tru.exe (0x849948, 0x849758) and the device's DrawPrimitive / DrawIndexedPrimitive slots
Flat=0
; 0.15: drawable pass ids the flat view colours, a hex mask of 0x200 0x100 0x80 0x400 0x800 1 2; 0.20: 0x600 = the census of 2026-11-06
; (0x200 main colour pass + 0x400 small rest; 0.15 - 0.19: 0x200) - dbg.flatpasses census takes a new suggestion
FlatPasses=0x600
; 0.15: material = a palette colour per material (hash of [0xa14188]); class = terrain one colour, models another
FlatColour=material
; 0.15: 1 = models (Lara, enemies, objects) flat too; 0 = only the terrain, models keep the game's shading
FlatModels=0
; 0.15: 1 = edge pass: every flat draw again as a dark wireframe (one more draw per draw)
FlatEdges=0
; 0.15: 1 = flat in every render target; 0 = only in targets of the back buffer's size (shadow maps / reflections keep
; the game's shading even with a wrong pass mask)
FlatAnyTarget=0
; 0.16 (dbg.depth): 0 = debug view lines on top of everything (as 0.15); 1 = hidden behind the level geometry and Lara (drawn
; inside the game frame with the scene's depth buffer - patches the PCScene::Draw vtable word 0x849a2c while on and a layer is
; on); 2 = like 1, the hidden parts faint (DepthDim); 0.20: 2 by default (live: 1 hid almost every box)
Depth=2
; 0.16: Depth=2 - opacity of the hidden parts in percent, 5 .. 80
DepthDim=25
; 0.16: Depth - which PCScene::Draw of a frame (counted among those into a back-buffer-size target with a depth surface)
; the lines go into, 0 .. 7 (dbg.style shows how many there are); 0.17: -1 = auto, the first of them whose view maps
; (live 2026-11-06: scene 0 did not map - dbg.depthdump writes every scene's matrices to TruMenu.log)
DepthCall=-1
; 0.16 (dbg.alpha): opacity of every debug view line in percent, 10 .. 100 (0.15: 100)
LineAlpha=60
; 0.16 (dbg.bright): brightness of the debug view colours in percent, 30 .. 150
LineBright=100
; 0.16 (dbg.fade): 1 = far objects fainter (from FadeStart to FadeEnd game units from the camera, down to FadeMin percent); 0 = off
Fade=1
; 0.16: distance where the fade starts (game units, 0 .. 100000)
FadeStart=2000
; 0.16: distance where the fade reaches FadeMin (game units, 500 .. 200000)
FadeEnd=10000
; 0.16: opacity left at FadeEnd and beyond, percent 0 .. 100
FadeMin=20
; 0.16 (dbg.fill): 1 = faint face fill of trigger boxes / planes and loading areas (FillAlpha); 0 = lines only
Fill=0
; 0.16: opacity of the face fill in percent, 2 .. 40
FillAlpha=10
; 0.16: at most this many labels of triggers, loading areas and checkpoints together, the nearest first, each nudged or
; skipped when it would overlap another, 0 .. 64 (TriggerLabelMax still caps the trigger names)
ViewLabelMax=10
; 0.16 (dbg.short): 1 = short labels (TV 4463, TP 4129, FIRE 4492, '-> main_bedroom') - the nearest one and the one at the
; screen centre keep the full name; 0 = full names
LabelShort=1
; 0.16 (dbg.larain): 1 = the triggers the test point (Lara +200) is in are drawn bold with a pulsing white outline and named
; in the legend (Lara in: ...); 0 = off
LaraIn=1
; 0.18: 1 = the legend keeps its row 'Lara in: ...' (0.16 / 0.17); 0 = the names are in the position overlay (OverlayLaraIn)
; only - the pulsing outline of LaraIn stays
LegendLaraIn=0
; 0.16 (dbg.enclosing): boxes around the camera, or big ones (EnclosingSize) around Lara: 0 = drawn like the others, 1 = dim
; and dashed, 2 = hidden
Enclosing=1
; 0.16: a box / sphere counts as big from this half extent / radius on (game units, 100 .. 100000)
EnclosingSize=1500
; 0.16: checkpoint markers at most this percent of the screen height (the active one stood at Lara and filled the
; foreground), 2 .. 50
MarkerMax=8
; 0.16: layers dbg.view (Alles an / aus) and View=1 leave off - comma list of layer names (death, fire, checkpoint, water,
; sound, volume, plane, unknown, portals, checkpoints, trglabels, legend, names, slide, enemycoll, collect,
; enemies); empty = none
ViewSkip=sound
; 0.20: 1 = collectibles on from the start (dbg.collect): every *_rw_* reward (artifact gold, treasure pink, shard
; turquoise, other reward light gold) and every reward pot / weight-break container (magenta ring, 'enthaelt
; Artefakt' + the reward index of its intro data)
Collect=0
; 0.20: 1 = enemies on from the start (dbg.enemies): every AI enemy, colour by kind (thralls, spiders, sharks, big cats,
; naga, bats, mercs, other), label name + intro id + LP + distance; thralls with the targeter 9 line of dbg.labels
Enemies=0
; 0.20: collectibles / enemies only up to this distance from the camera (game units, 500 .. 200000)
MarkRadius=15000
; 0.20: at most this many collectible and this many enemy markers per frame, the nearest to the camera first, 1 .. 64
MarkMax=24
; 0.20.1: 1 = one TruMenu.log line whenever the behaviour state of an enemy with a drawn label changes (dbg.enemies /
; dbg.labels; e.g. Vaulted -> Land -> Getup, RegenerateDeath -> Regenerate); never per frame
EnemyStateLog=0
; 0.21.1 (dbg.hpbar): 1 = the enemy labels of the layer Gegner (dbg.enemies) show a health bar (green -> red, LP / max LP
; of the difficulty) instead of the LP number; 0 = the number as in 0.20.1
EnemyHpBar=1
; 0.17 (dbg.cp / dbg.cpall): intro ids of checkpoints whose marker is not drawn (comma list; written back with Persist=1);
; empty = every checkpoint drawn
CheckpointHide=

[Quick]
; 0.17 Schnellschalter (quick.open): 1 = OpenButtons open / close a small bar at the left screen edge while the game
; keeps running: D-pad up / down = row, left / right = off / on (value rows: one step), LB / RB = page, X = run
; the row, Y = pin / unpin it as a favourite (0.21.3); only D-pad, LB, RB, X and Y are kept from the game while it is
; open; 0 = off (the buttons reach the game as before 0.17)
Enabled=1
; 0.17: XInput buttons pressed together that open / close the bar (hex or decimal): 0x0030 = View (Back) + Start -
; menu buttons of the game (pause / PDA), never pressed together by it; do not use D-pad, LB, RB, X or Y here
OpenButtons=0x0030
; 0.17: milliseconds a lone OpenButtons button is kept from the game waiting for the other one, 50 .. 1000; released
; earlier the game gets it as a short tap, held longer it gets it (late)
ChordMs=250
; 0.17: 1 = the closed bar shows one line 'Debug: N an' (needs [Debug] Enabled=1, in a level); 0 = nothing while closed
ShowClosed=1
; 0.17: language of the bar, de or en (quick.lang switches it until the next start)
Language=de
; 0.17: top edge of the bar in percent of the screen height, 5 .. 80
Top=30
; 0.17: text size of the bar relative to the menu font, 0.5 .. 3
Scale=1.0
; 0.21.1: keys of the closed groups of the bar (comma list; the bar rewrites it when a group is opened / closed:
; right = open, left = close); empty = every group open
Closed=
; 0.21.1: rows of 'Zuletzt' on page 0 'Favoriten / Zuletzt', 0 .. 16 (0 = no recent list)
RecentMax=8
; 0.21.1: the last bar rows that ran, newest first ('id arg;id arg'; the bar rewrites it)
Recent=

[AI]
; 0.19 Dumme KI (ai.dumb): enemies ignore Lara from the start - 0 = off, 1 = every AI enemy, 2 = only the enemies whose
; object name contains a part of DumbFilter. Switched while the game runs with ai.dumb (ring Spieler / Debug / KI and
; Spieler / Barrierefreiheit, quick-toggle bar Render / KI and Notfall, menu page AI); not written back
Dumb=0
; 0.19: comma list of object name parts for Dumb=2 and 'ai.dumb filter' (shark = sharks, spider,tarantula = spiders,
; thrall = thralls, merc,poacher = humans, tiger,panther = big cats); empty = every AI enemy
DumbFilter=
; 0.19 (ai.mode): gate = stage B - while ai.dumb is on in a level 4 calls + 1 vtable slot of tru.exe lead through
; TruMenu, Lara never gets into the list (put back when off, at a level change, at unload); purge = stage A, no code
; patch - the engine's sense reset 0x65a140 once per frame. 0.20: gate by default (live 2026-11-06: purge did not
; stop a tarantula, gate did); purge = the fallback when the gate checks fail
DumbMode=gate
; 0.19 (ai.noinvestigate): 1 = the enemies of the ai.dumb filter (every AI enemy while ai.dumb is off or all) do not
; walk to noises - brain+8 bit 0x80, the prototype's g_enemyNoInvestigate; set per frame, cleared again when off
NoInvestigate=0
; 0.19 (ai.noattack): 1 = the same enemies do not attack - brain+8 bits 0x20 (Attack / ScriptAttack) and 0x100000
; (Melee), the prototype's g_enemyNoAttack; partial: close / ranged combat states not checked
NoAttack=0

[Sound]
