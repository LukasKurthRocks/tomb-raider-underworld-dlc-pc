Sort=group
; 0.20.1 (snd.scale): font scale of the sound list, 0.5 .. 3
FontScale=1.0
; 0.20.1 (snd.playing): 1 = only audible voices; 0 = also paused, muted, virtual, starting and ending ones (dimmed)
OnlyPlaying=0
; 0.20.1 (snd.music): music lines (the groups of the music slider and of the channel group 'music')
ShowMusic=1
; 0.20.1 (snd.sfx): SFX lines (the group of the effects slider)
ShowSfx=1
; 0.20.1 (snd.speech): speech lines (the group of the third slider - speech / cutscenes)
ShowSpeech=1
; 0.20.1 (snd.other): lines of voices in no known group
