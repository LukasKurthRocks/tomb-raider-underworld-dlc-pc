; TruMercLang.asi options (next to tru.exe). All keys are optional; the values below are the built-in defaults.
[MercLang]
; 1 = the mercenaries' barks (Andaman Sea / Mediterranean ship levels) play in Language; 0 = load but hook nothing
Enabled=0
; en, fr, de, it, es (the game's language ids 0-4, mask 1 << id) or off. Lara, story, subtitles keep the game language.
; Language-neutral barks (voice m11, pain sounds) have one recording only and stay as they are.
Language=es
; only lookups whose path contains this text are redirected (case-insensitive, / or \)
PathFilter=\vo\enemy\merc\
; 1 = read Enabled / Language again when this file changes while the game runs (from the next bark on);
; the hook itself goes in only when Enabled=1 at game start
LiveReload=0
; 0 errors, 1 info (start, checks, first redirect of every path, a count line every 30 s), 2 + unchanged
; (language-neutral) paths, 3 + every byte check
LogLevel=1
