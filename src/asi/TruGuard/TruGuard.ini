; TruGuard.asi options (next to tru.exe). Delete this file to use the built-in defaults.
; Developer tool for the DLC port: logs access violations in tru.exe, writes a minidump per site (one MaxDumps slot
; stays reserved for a later fatal hit) and can resume after a bad data access so one run shows several broken
; places. See TruGuard.log.
[Guard]
; 0 = load but watch nothing
Enabled=1
; 0 errors only, 1 sites + unhandled faults + resumes, 2 also repeats of first-chance faults, 3 everything
LogLevel=1
; 0 = log only, 1 = log + one minidump per site, 2 = log + dump + continue where a rule / decoder allows it
; (2 does NOT install anything; it only changes the faulting thread's context on the fly)
Mode=1
; 1 = a one-line note for every distinct first-chance fault (also the ones the game handles itself);
; 0 = only the detailed record when the fault really ends the process
FirstChance=1
; 1 = write the full record (registers, stack, game context) for the first occurrence of each site, even if the
; game handles the fault itself; a later fatal hit at the same site gets a second record for that hit
FirstChanceDetail=1
; 1 = also write the minidump at first chance (slows the game down: use it for fault hunts, not for playing)
FirstChanceDump=0
; minidumps into TruGuardDumps\ (one first-chance dump per site; the last MaxDumps slot is kept for a fatal dump)
Dump=1
; 0 = none, 1 = mini (thread info, indirectly referenced memory, data segments, memory info, unloaded modules),
; 2 = full memory (adds full memory/handle data)
DumpType=1
; stop writing dumps after this many files (no new site is marked as dumped once the cap is reached)
MaxDumps=16
; generic skip limit per site when no [Sites] rule matches (Mode=2 only)
MaxHitsPerSite=8
; 1 = decode the faulting instruction and skip it when no [Sites] rule matches (Mode=2: the generic fallback;
; this can turn a data error into a wrong value instead of a crash - use it to find more sites, not to play)
SkipUnknown=0
; allow resuming after a write / execute access violation (0 = always let those crash)
AllowWriteSkip=1
AllowExecuteSkip=1
; stack chain (ebp walk) and memory around the fault address / registers in the record
LogStack=1
LogContext=1
; worker: 1 = one TRUGUARD_HANDLED line per site if no unhandled filter call followed within 2 s (the game
; handled the fault); 0 = off
HandledNote=1
; UEF: 1 = write a short TRUGUARD_OUTSIDE record for a fatal fault outside tru.exe (FMOD/WINMM/plugin threads);
; 0 = off
OutsideFatal=1
; Mode=2 safety: stop skipping after this many resumes in one second (0 = no cap); the next fault then crashes
MaxResumesPerSecond=20

; Per-site rules. offset = tru.exe offset (hex with 0x, as used in the docs), then
;   skip,eax,ecx,limit
; -1 = leave that register alone; skip -1 = use the instruction decoder, skip 0 = never resume this site;
; limit = max resumes for this site (-1 = MaxHitsPerSite). Optional trailing flags: w = allow write skip,
; x = allow execute skip.
; The two known NULL-native sites of the script interpreter (docs Befund-Erfolge, Abakus-Pruefung):
;   0x17dea3  mov ecx,[ecx+14]   3 bytes
;   0x17deae  call ecx           2 bytes, the call result in eax
; Uncomment both and set Mode=2 to walk past a missing TU native instead of crashing:
; Site1=0x17dea3,3,-1,-1,8
; Site2=0x17deae,2,0,-1,8
[Sites]

; Sites whose first-chance faults are only counted: no TRUGUARD_FAULT marker, no first-chance record, no
; TRUGUARD_HANDLED line (a fatal unhandled record is still written, a [Sites] rule still applies).
; Site1=0x1dba2d
[Ignore]

; GuardRails: passive context, plugin events and the rail policy. No game code is patched.
; Enabled=0 turns sampling, events and rail calls off (TruGuardRail then always returns 1).
; AttachPending=1 writes a TRUGUARD_RAIL line for every new box/attach state while a markup box is present but the
; attach box is still 0. These lines are not capped by [Rail.*] Limit (the line always reports hits=1).
[GuardRails]
Enabled=1
Events=1
AttachPending=1

; Per-rail policy for plugins that call TruGuardRail(id, value):
;   Action=off | log | block   (log = allow + marker, block = return 0 so the caller uses its safe action)
;   Limit=N                    max TRUGUARD_RAIL lines for this rail (the return value is not limited)
[Rail.state572_attach]
Action=log
Limit=1

[Rail.point_on_box]
Action=log
Limit=1

[Rail.slot8_box]
Action=log
Limit=1
