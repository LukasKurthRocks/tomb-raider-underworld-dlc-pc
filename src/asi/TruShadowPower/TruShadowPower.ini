; TruShadowPower.asi options - put next to tru.exe together with TruShadowPower.asi (optional; defaults below)
[ShadowPower]
; 0 = load but hook nothing
Enabled=1
; 0 errors, 1 info (incl. the tuning values in use), 2 every start / stop, 3 debug - TruShadowPower.log next to tru.exe
LogLevel=1
; XInput button mask that holds the power: 0x0100 LB, 0x0200 RB, 768 (0x0300) = either (Xbox); LB also sprints on PC
Buttons=768
; 0.9: 0 = the TU tick: runs only in doppelganger mode (DLC 2, TruDlc2Player.asi), stops / refuses the power during a
; cinematic and at 0 health; 1 = the 0.8 tick (every level, no gates)
LegacyPadStart=0
; 0.9: 1 = read LB / RB from the game's input records (+0x1a70 / +0x1b30, the TU's source - not proven on PC, see the
; "input diagnostic" log lines); 0 = from the pad poll (XInput, Buttons above)
GameInput=0
; 0.17: 1 = LB / RB count only as the game gets them: a button TruMenu keeps from the game (menu, ring, quick bar) is
; ignored until it is released - also after the menu closes (0.19: from TruMenu's export TruMenuPadBlock, TruMenu
; 0.21.1 or later, whatever the order of the pad hooks - no re-wrap of the pad chain any more);
; 0 = as 0.16 (the pad as read in the hook chain)
MenuInput=1

[Meter]
; The meter, its rates and the slow-motion scales are translated from the Xbox title update and read from the same
; data (object player_tru_dlc2_extension, see README.md) - no rate options any more.
; feed the HUD's second silhouette (the yellow bar) while the meter drains / refills; 0 = no HUD writes
HudBar=1
; 1 = when the extension object is not loaded, use a copy of its file values (logged as FALLBACK);
; 0 = no object, no power (as on the Xbox)
Fallback=1
; 0.23: 1 = infinite shadow power for testing / accessibility (not a TU feature): the meter stays at max - the tick
; fills it, every drain leaves it full; slow motion, look and strike work as with a full meter, no "meter empty".
; 0 = the TU meter (drain 200 / s, refill). Read again at run time at most once per second. Default 0
Infinite=0

[Conditions]
; 1 = add the title-update conditions that read the meter to Lara's own link array, translated from the Xbox TU:
; 1049-1051 compare the meter value, 1052-1054 its percentage with the record (equal / >= / <=), 1056 = meter at or
; above tuning +0x70 (75 %) while the power is active. Needs TruDoppelganger.asi (the game takes only ids that are also
; in the generic registry). 0 = leave Lara's table alone (the records then presumably reach the default handler,
; which answers true - TruRockVein.asi 0.2 logs that).
Enabled=1

[States]
; 0.5: translated title-update states / conditions / activities of Lara's state machine (README.md, 0.5):
; states 243 (move to the markup point), 245 (move tuning +0x6c = 1896 units along the player at 410.87 units/s -
; wall-run candidate), 1018 (meter cost + world time-scale request of a shadow move), conditions 1048 / 2401,
; activities 1009 / 1039. Needs TruDoppelganger.asi like [Conditions]. 0 = leave them out (state as in 0.4).
Enabled=1
; 0.11: state 2102 of the wall run (TU: the Lara camera jumps to the end of its current blend while it is the active
; camera); 0 = leave it to the PC default state
State2102=1

[Look]
; 0.8: the look of the power, translated from the title update: start fires the player events 0x89 / 0x32 /
; 0x81 / 0x87 or 0x88, stop 0x33 / 0x7e or 0x82 (the effects themselves are data of doppelganger_casual.drm, see
; README.md). 0 = slow motion and meter only (0.7 behaviour)
Enabled=1
; 1 = start / stop also send message 0x1f4 / 0x1f5 to every instance that answers query 0x172 (TU 0x823d7f18 /
; 0x823d8080; the level objects that react to the power); 0 = no messages
Messages=1
; 0.9: the TU's adrenaline look: meter flag 0x40 while the power is on and Lara aims / targets (world 0.1), and in
; doppelganger mode camera mode 0x34 / adrenaline / condition 1047 by that flag; 0 = off (0.8 behaviour)
AdrenalineMode=1
; 0.10: the full-screen effect of the start event 0x32 (record 14 of doppelganger_casual -> material 20744, the soft /
; bright look). 1 = keep it and report it in the log (needs the data tree dlc_test50l_look with the translated shader);
; 0 = remove it right after it is created (data without the fix: otherwise the screen turns black / white-black)
ScreenEffect=1
; 0.11: GlobalParams[7] (pixel-shader c147) = (meter / max, meter / start value, power on, look fade), set every frame
; like the title update while the DLC 2 tuning object is loaded - read by 19 TU shaders (the look 20744, the rock vein
; strip, ...); 0 = not set (stays 0 on the PC)
GlobalParams7=1
; 0.12: the second block the title update appends there: the player model's InstanceParams[1] = (1, 0, 0, 0) while a
; cinematic runs, else (0, 0, 0, 0) (read by the TU shaders through InstanceParams); 0 = not set
CinematicParam=1
; 0.14 (MoveEvents / StrikeLook default 0 = as 0.13; CameraFlag default 1 since 0.20):
; 1 = the TU's movement events of the power (0x823d77f0): player event 0x84 when |gameTracker+0x1f0| falls to <= 10
; while the power is on, 0x83 by the TU's 3000 ms rule, and 0x83 at the start while moving (record: sound 0x1cd)
MoveEvents=0
; 1 = the start calls the camera manager's vtbl[0xa4] like the TU (camera +0x80 |= 2, a sticky flag until the next
; camera reset: the camera reader tru+0x1e5e8e = TU 0x822a9a7c takes the second set of camera curves +0x9c / +0xe8);
; 0.20: default 1 = TU; 0 = not called (as 0.14-0.19)
CameraFlag=1
; 1 = the shadow-strike look (TU 0x823d8a80 / 0x823d9050 on player anim events 5 / 4 in doppelganger mode): meter flag
; 4 (condition 1055), flag 0x200 on the second model, aim at the target's segment of query 0x188, request slot 2; needs
; TruShadowCombat's strike ([Strike] Translate=1) to set meter flag 2
StrikeLook=0

[Sound]
; 0.14: 1 = the looping sound of the power (TU meter +0x0: the SoundPlex data at tuning +0x5c of object 858, started /
; positioned while the power is on, stopped when it ends); 0 = no loop (as 0.13)
LoopSound=0

[Cloth]
; 0.15: 1 = the TU's player cloth time step (TU 0x82278120): Lara's cloth (the ponytail, component 14) is updated with
; the frame time divided by the world time scale, so the hair keeps real time while the world is slowed (shadow power,
; base-game slow motion) instead of stretching; works in every level, like the TU. 0 = PC behaviour (as 0.14)
; 0.25: key renamed from TuTimeStep (the old name is still read when this key is missing)
ClothTuTimeStep=0

[Camera]
; 0.24: 1 = the TU's camera time step (TU 0x822ad048 / 0x822beeb8 / 0x822c39c8 / 0x822c79d0): the camera manager and
; the three Lara cameras run on the frame time divided by the world time scale, so while the shadow power slows the
; world (0.3) the camera still follows / re-centres behind Lara at normal speed (Xbox: e.g. when climbing with the
; power). Every level, like the TU. 0 = PC behaviour (as 0.23)
; 0.25: key renamed from TuTimeStep (the old name is still read when this key is missing)
CameraTuTimeStep=0
; 0.25: the TU's camera settings in doppelganger mode (TU 0x822bc198 / 0x822c61d8): cameras without own settings use
; DTP 21237 (Lara cameras) / 21238 (combat camera) instead of the GlobalInfo defaults - on the Xbox the auto-recenter
; starts after 0.25 s and fades in over 5 s, on the PC (DTP 20) after 5 s over 2 s.
; 0 = PC (default). 1 = the TU choice 1:1, but only when DTP 21237 / 21238 are loaded (the installed generalbank does not
; have them yet - then nothing changes, see TruShadowPower.log). 2 = like 1, plus a stand-in for 21237 while it is
; missing: the PC default DTP 20 with the TU's delay 0.25 s / ramp 5.0 s and (0.26) 21237's per-mode tables (climb
; modes 60 / 61 / 62, mode 8 and 0 / 23 / 32 / 33 / 34 / 58 / 59 / 63 as on the Xbox; outside these tables and the two
; times 21237 equals the retail default). Read at the start only.
DoppelgangerSettings=0
; 0.25: 1 = TruCam.log next to this plugin: one TSV row every TraceInterval ms while Lara exists (camera / Lara yaw,
; recenter clock and settings, world time scale, meter, pad 0), the same columns as tools/truxenia.py --camtrace on the
; Xbox (tools/cam_compare.py compares both). Read only. Read again at run time at most once per second. Default 0
Trace=0
TraceInterval=50

[Adrenaline]
; 0.18 (K11): CombatManager::Update (tru+0x3227d0) as the title update (TU 0x823dca00): in doppelganger mode
; (gameTracker+0x1244, set by TruDlc2Player 0.4) the retail adrenaline tick tru+0x318bd0 (R3 start / stop) and the
; adrenaline bar tru+0x2f2930 are not called - the bar no longer overwrites the HUD value [0xfae8d4] of the shadow meter
; every frame. 0 = PC (both always). Read again at run time at most once per second. Default 1
Translate=1
; 1 = one line whenever the decision per call site changes (runs / skipped / switch off), with the counts
Log=1

[TimeScale]
; 0.21 (X23): the gamebase script natives 23 / 24 (tru+0x397cf0 / tru+0x397d10) as the title update (TU 0x824a3238 /
; 0x824a32f0): in doppelganger mode native 23 writes time-scale request slot 6 PLAYER, native 24 slot 6 WORLD (crossed,
; as the TU), then the request selector; outside it they set the ramps directly as before. One log line per slot-6
; change. Read again at run time at most once per second (only if it was 1 at the game start). 0 = PC. Default 1
TranslateSlot6=1

[Reticle]
; 0.22 (K-5): the combat reticle ("ring", HUD script 37, HUD group 12) and the adrenaline refill as the title update.
; 1 = in doppelganger mode (gameTracker+0x1244, TruDlc2Player) playerDrawCombatLock tru+0x31e710 requests the ring by
; meter flag 2 (the shadow strike, TruShadowCombat [Strike] Translate=1) instead of CM+0x1fc bit 21 (TU 0x823de47c);
; 0 = PC (bit 21, never set in DLC 2). Read again at run time at most once per second. Default 1
TranslateRequest=1
; 1 = in doppelganger mode the adrenaline refill message (tru+0x31f500) is skipped by meter flag 2 instead of bit 21
; (TU 0x823ee158) and the "adrenaline full" helper tru+0x2e6630 tests meter flag 0x40 instead of bit 27 (TU 0x823dfd98);
; 0 = PC. Read again at run time at most once per second (a site is hooked when its switch or Log is 1 at the start).
; Default 1
TranslateRefill=1
; 1 = one line whenever a decision of these three sites changes (the first 60 per site at LogLevel 1, then LogLevel 2)
Log=1
