; TruRockVein.asi options (next to tru.exe). Delete this file to use the built-in defaults.
[RockVein]
; 0 = load but patch nothing
Enabled=1
; 0 errors only, 1 info + first call of each condition + unhandled ids, 2 + every change of a result, 3 every call
LogLevel=1
; 1 = also log the other markup conditions the PC exe does not implement (ids 604-606, 609, 619, 621, 622, 627)
LogUnhandled=1
; markup types the two title-update conditions test for (Xbox title update: 607 = 23, 608 = 22)
Type607=23
Type608=22
; 0.2 probes (read only): log markup record values outside 601..628 once each (state chart in the wrong byte order)
LogBadValues=1
; 0.2 probes (read only): log each condition id answered by the default handler (missing in the agent's link array)
LogDefaultConditions=1
[SweepAndPrune]
; 0.10: 1 = markup collision pool with the title-update limits (TU 0x8227b9f0: create(3000, 500) = 3000 boxes, 1000 pair
; links; PC 1000 / 400; +412800 bytes once); read at the game start, one control line on the first frame
Translate=1
[LedgeCorner]
; 0.11: 1 = ledge-corner nudge as the title update (TU 0x8242eeac: same box and same segment as the corner partner ->
; t = floor - 0.001 when the look-ahead direction is 4, else floor + 1.01); one log line on the first nudge
Translate=1
