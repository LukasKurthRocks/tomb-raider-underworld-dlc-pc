; TruShadowHud.asi options (next to tru.exe). All keys are optional; the values below are the built-in defaults.
[ShadowHud]
; 0 = load but patch nothing
Enabled=1
; 0 errors, 1 info (first call of every native), 2 also every change of a native's result (red / pulse / delay)
LogLevel=1
; bind the TU larabase natives f70-f73 (vtable 0x862a38 slot 3) when the larabase script has 74 entries
LaraNatives=1
; register the TU native type dlc2data and bind its f0 (TruDlc2Player's doppelganger flag)
Dlc2Data=1
; 1 = f70-f73 through TruShadowPowerMeterApi (version 2); 0 = always the TU answers without the tuning object
MeterApi=1
; 0.2: bind the TU native dlc2data f1 (TU 0x824a11a0: stores its bool argument, the hint-box script's "modal DLC 2 box
; open"; on the Xbox only the Guide pause reads it, the PC has no reader); 0 = f1 left unbound as 0.1
TranslateDlc2F1=1
