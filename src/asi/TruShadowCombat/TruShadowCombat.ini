; TruShadowCombat.asi options (next to tru.exe). Delete this file to use the built-in defaults.
[ShadowCombat]
; 0 = load but patch nothing
Enabled=1
; 0 errors only, 1 info (first call of every translated condition / state, the targeter parameters),
; 2 + every result change and every patched site, 3 + a line every 2 s per condition while it is evaluated
LogLevel=1
[TargetList]
; the title update's 10 targeters instead of 7 (TU 0x824062c8 / 0x82406390 / 0x82402208); slot 7 = TU 6,
; slots 8 / 9 = TU 8 / 9 with the parameters of the DLC 2 tuning (object 858). 0 = PC list unchanged
; (then conditions 2005 / 2006 / 2013 and the doppelganger branch of 2011 answer 0)
Enabled=1
[Conditions]
; Lara's conditions 2005 / 2006 / 2013 (new), 2011 / 538 (doppelganger branch) in both state machines
Enabled=1
[States]
; 0.2: TU states 1017 (pick / face the target; writes the target conditions 2013 / state 244 read), 244 (dash to it)
; and the doppelganger slots 4 / 5 of 1007 (all need the target list)
Enabled=1
; 0.4: state 1013 (finisher on a downed enemy) in doppelganger mode as the TU: target of targeter 9, hit record +0x68
; from the attack data, hit list +0xa4, message record +0x3c = 0. Default 0 (not played yet). 0.4.1: the three sites
; are patched at the start (0 = they run the PC path); this key is read again at run time (at most once per second)
Translate1013=0
; 0.5: states 1019 (doppelganger combat hub: target 5 into the meter, step next to it / face it, follow it every
; frame) and 1020 (after the finisher: step next to the target of targeter 8) as the TU 0x8245f420 / 0x8245f540 /
; 0x8245f398. 0 = registered but only logged (what the TU would do); 1 = act. Read again at run time (at most once
; per second). Default 0 (not played yet)
Translate1019=0
Translate1020=0
; 0.5.1: TU table differences of two retail states (main game too, as on the TU). 231 (move to gameTracker+0x1260):
; the TU's slots 0 and 1 run the move helper with its doppelganger branch (TU 0x82464160 -> 0x82463c18); the PC has
; only slot 0 with the retail helper. 1004: the TU keeps the hit list of the finisher (player +0xa4) when the state
; parameter 0x415 is set and runs the same also in slot 1; the PC always clears it. 0 = PC handlers, the log says what
; the TU would do differently ("off (would)"); 1 = as the TU. Read again at run time (at most once per second)
Translate231Slot0=0
Translate231Slot1=0
Translate1004=0
[Strike]
; state 1014 in doppelganger mode without the translation: 1 = do nothing, 0 = run the PC's retail strike as before
Gate=1
; 0.2: 1 = the TU's shadow strike (0x823d8978 / 0x823d86a8 / 0x823d8d18 / 0x823d9210) in doppelganger mode; needs
; TruShadowPower with TruShadowPowerMeterApi (0.11 or later). Default 0 (not played yet). 0.4.1: read again at run
; time (at most once per second; a running strike keeps its value until its end); needs Gate=1 or Translate=1 at start
Translate=0
[Probe]
; 0.3: log state 1013 (the finisher on a downed enemy, PC tru+0x31d600): the PC's target (targeter 5) next to the
; TU's (doppelganger: targeter 9); the PC handler runs unchanged
State1013=1
; 0.5: register states 1019 / 1020 at all (log only unless [States] Translate1019 / Translate1020 = 1); 0 = Lara's
; table without them, as 0.4.1
States1019=1
; 0.5.1: wrap states 231 / 1004 (slots 0 / 1) at all; 0 = the PC records untouched, as 0.5
States231And1004=1
[Diag]
; 0.5.2 (F21, log only - the game code runs unchanged): who fills / clears targeter 9 (TU index 9, the finisher's
; target): candidate add tru+0x3164d0 (instance, marker data, mask, caller), per-frame bucket counts tru+0x31a270,
; select tru+0x316590, set target tru+0x316730, remove tru+0x319f80, target list array build / destroy. 0 = no hooks
Targeter9=1
; once per second: for up to 4 rejected candidates of targeter 9 the game's own eligibility tru+0x2ecca0 and filter
; tru+0x312090 per group (the same functions the update calls for them every frame) - which test rejects them
Targeter9Why=1
; every evaluation of condition 2011 in doppelganger mode with its inputs (record, targeter 9 before / after the get
; call, excluded, query 0x161) - on every change, else every 2 s
Condition2011=1
; total cap of the 0.5.2 diagnostic lines
MaxLines=4000
; 0.5.3: read-only export TscTargeterSnapshot for TruMenu 0.13's thrall labels (targeter 9 buckets / rejected with the
; WHY result / target, the player's hit list, the last condition 2011). Needs Targeter9=1; the copy is built on the
; game thread only while TruMenu asks (labels on). 0 = the export answers "none"
Snapshot=1
[Damage]
; 0.6 (K14): the enemy damage function tru+0x237590 (TU 0x822f60e0). Its switch over the damage type ends at 16 on the
; PC; the title update goes to 27 (17 = nothing, 18..27 = damage + death check like 0, 1, 2 ...). Lara's DLC 2 attacks
; use 17..27, so on the PC those hits are dropped (no damage, no death / regenerate check).
; 1 = extend the switch exactly as the TU (bound 0x1b + the TU's 28-entry table owned by the plugin). Read again at
; run time at most once per second while hits come (needs Log=1 or Translate=1 at the start). 0.6.3: default 1 (a pure
; TU translation, live 07.11.: -40 per hit, the tutorial thralls die, the hall02 wall breaks); 0 = the PC switch
Translate=1
; 1 = count the incoming damage types per target and log them every 2 s while hits happen ("0.6 damage types: ...",
; with the verdict of the PC switch and of the TU's). Changes nothing in the game
Log=1
; total cap of the damage lines
MaxLines=3000
[Chunk]
; 0.6.1: an enemy whose LP is already <= 0 when Lara's hit impulse (message 0x91) arrives. Lara's contact callback
; sends it from INSIDE the physics step; the PC (= retail) then builds the chunkdoll at once and the locked step refuses
; its rigid bodies -> fatal "ChunkDoll: failed to create geom". The title update replaced that branch (TU 0x82305ba0):
; unless the enemy is already in a death state it is switched to Death (kind 7) and the Death state makes the chunkdoll
; in the enemy update, outside the step. 1 = as the TU (default), 0 = the PC branch. Read again at run time at most
; once per second when the branch is reached (needs Translate=1 or Log=1 at the start)
Translate=1
; 1 = one burst line every 2 s per enemy while it happens ("0.6.1 chunk: ..." with the physics lock at that moment and
; what the PC alone would have done). Changes nothing in the game
Log=1
; total cap of the chunk lines
MaxLines=2000
[Splash]
; 0.6.2 (K9): CombatManager::MeleeSplashDamage tru+0x2e68b0 as the title update (TU 0x823e1220 / area damage
; 0x8237ae88). 1 = (a) the main target of the hit (CombatManager+0x48) gets no extra splash hit - the area damage
; tru+0x29f1e0 skips it for this caller, as the TU (also outside doppelganger mode); (b) in doppelganger mode the splash
; type is remapped through object 858's pair table (0x1a -> 0x10, 0x10 -> 0x16) - only while the K14 switch is extended
; ([Damage] Translate=1), because 0x16 = 22 is a type only the TU switch accepts. 0 = the PC splash. Read again at run
; time at most once per second while splashes come (needs Translate=1 or Log=1 at the start). Default 1
Translate=1
; 1 = when object 858's pair table differs from the Xbox values (the converted file holds three of its four words
; unswapped), use the Xbox values {0x1a -> 0x10}, {0x10 -> 0x16} (DTP 22497 +0x1b0) and say so; 0 = the table as loaded
Fallback=1
; 1 = burst lines every 2 s while splashes happen ("0.6.2 splash: ..." with type in / out, main target, the verdict of
; the enemy switch). Changes nothing in the game
Log=1
; total cap of the splash lines
MaxLines=2000
[Death]
; 0.6.3 (P1a, T3): the enemy death check tru+0x220380 (TU 0x822f6578) - when a lethal hit lets the enemy
; regenerate (ShouldRegenerate yes) the title update sends script notification 33 (PlayNotification) before it
; puts the enemy into RegenerateDeath; hall02's level script answers with the finisher hint hint_17 (once).
; 1 = as the TU (notification 33, then the PC's EnterRegenerateDeath tru+0x282780 as before), 0 = no notification
; (PC). Read again at run time at most once per second when a lethal regenerate hit comes. Default 1. One log line
; per such hit ("0.6.3 death: ...", at most 1000). The TU's Land path (T2) is not translated: it needs the TU's
; companion instance (T4), which the PC does not have
TranslateNotify33=1
