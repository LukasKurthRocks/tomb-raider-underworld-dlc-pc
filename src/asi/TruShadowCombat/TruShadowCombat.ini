; TruShadowCombat.asi options (next to tru.exe). Delete this file to use the built-in defaults.
[ShadowCombat]
; 0 = load but patch nothing
Enabled=1
; 0 errors only, 1 info (first call of every translated condition / state, the targeter parameters),
; 2 + every result change and every patched site, 3 + a line every 2 s per condition while it is evaluated
LogLevel=1
[TargetList]
; the title update's 10 targeters instead of 7 (TU 0x824062c8 / 0x82406390 / 0x82402208); slot 7 = TU 6,
; slots 8 / 9 = TU 8 / 9 with the parameters of the DLC 2 tuning (object 858). 0 = PC list unchanged
; (then conditions 2005 / 2006 / 2013 and the doppelganger branch of 2011 answer 0)
Enabled=1
[Conditions]
; Lara's conditions 2005 / 2006 / 2013 (new), 2011 / 538 (doppelganger branch) in both state machines
Enabled=1
[States]
; 0.2: TU states 1017 (pick / face the target; writes the target conditions 2013 / state 244 read), 244 (dash to it)
; and the doppelganger slots 4 / 5 of 1007 (all need the target list)
Enabled=1
; 0.4: state 1013 (finisher on a downed enemy) in doppelganger mode as the TU: target of targeter 9, hit record +0x68
; from the attack data, hit list +0xa4, message record +0x3c = 0. Default 0 (not played yet). 0.4.1: the three sites
; are patched at the start (0 = they run the PC path); this key is read again at run time (at most once per second)
Translate1013=0
; 0.5: states 1019 (doppelganger combat hub: target 5 into the meter, step next to it / face it, follow it every
; frame) and 1020 (after the finisher: step next to the target of targeter 8) as the TU 0x8245f420 / 0x8245f540 /
; 0x8245f398. 0 = registered but only logged (what the TU would do); 1 = act. Read again at run time (at most once
; per second). Default 0 (not played yet)
Translate1019=0
Translate1020=0
; 0.5.1: TU table differences of two retail states (main game too, as on the TU). 231 (move to gameTracker+0x1260):
; the TU's slots 0 and 1 run the move helper with its doppelganger branch (TU 0x82464160 -> 0x82463c18); the PC has
; only slot 0 with the retail helper. 1004: the TU keeps the hit list of the finisher (player +0xa4) when the state
; parameter 0x415 is set and runs the same also in slot 1; the PC always clears it. 0 = PC handlers, the log says what
; the TU would do differently ("off (would)"); 1 = as the TU. Read again at run time (at most once per second)
Translate231Slot0=0
Translate231Slot1=0
Translate1004=0
; 0.6.11: state 1008 (the finisher Y move on a downed thrall, record 743) as the TU 0x8245f7b0 / 0x8245fa40: enter and
; every tick steer Lara's motion channel onto the target of targeter TU 7 (PC slot 6); the PC's slot 4 (retail
; 0x8245bb30, only facing / point into gameTracker+0x1260 / +0x1270, the leap is root motion) is not run - the TU removed
; it. Every level (no doppelganger test in the TU). 0 = PC handler + "off (would)" lines; 1 = as the TU. Read again at
; run time (at most once per second). Default 0 (not played yet)
Translate1008=0
; 0.6.12: exit of state 1015 (the finisher Y attack, record 742) as the TU 0x8245fe58 ("ThrallFatalityEnd"): when the
; finisher's target stored in CM+0x48 is still valid, death switch kind 0 on it (LP 0, Death state; v = Lara - target,
; z = 0), then the PC's clear - the PC / retail never kills it there (the thrall got up again, live 2026-11-10 22:12).
; 0 = PC handler + "off (would)" lines; 1 = as the TU. Read again at run time (at most once per second). Default 0 (not
; played yet)
Translate1015Exit=0
[Strike]
; state 1014 in doppelganger mode without the translation: 1 = do nothing, 0 = run the PC's retail strike as before
Gate=1
; 0.2: 1 = the TU's shadow strike (0x823d8978 / 0x823d86a8 / 0x823d8d18 / 0x823d9210) in doppelganger mode; needs
; TruShadowPower with TruShadowPowerMeterApi (0.11 or later). Default 0 (not played yet). 0.4.1: read again at run
; time (at most once per second; a running strike keeps its value until its end); needs Gate=1 or Translate=1 at start
Translate=0
[Probe]
; 0.3: log state 1013 (the finisher on a downed enemy, PC tru+0x31d600): the PC's target (targeter 5) next to the
; TU's (doppelganger: targeter 9); the PC handler runs unchanged
State1013=1
; 0.5: register states 1019 / 1020 at all (log only unless [States] Translate1019 / Translate1020 = 1); 0 = Lara's
; table without them, as 0.4.1
States1019=1
; 0.5.1: wrap states 231 / 1004 (slots 0 / 1) at all; 0 = the PC records untouched, as 0.5
States231And1004=1
; 0.6.11: wrap state 1008 (slots 0 / 2 / 3 / 4) at all; 0 = the PC record untouched, as 0.6.10
State1008=1
[Diag]
; 0.5.2 (F21, log only - the game code runs unchanged): who fills / clears targeter 9 (TU index 9, the finisher's
; target): candidate add tru+0x3164d0 (instance, marker data, mask, caller), per-frame bucket counts tru+0x31a270,
; select tru+0x316590, set target tru+0x316730, remove tru+0x319f80, target list array build / destroy. 0 = no hooks
Targeter9=1
; once per second: for up to 4 rejected candidates of targeter 9 the game's own eligibility tru+0x2ecca0 and filter
; tru+0x312090 per group (the same functions the update calls for them every frame) - which test rejects them
Targeter9Why=1
; every evaluation of condition 2011 in doppelganger mode with its inputs (record, targeter 9 before / after the get
; call, excluded, query 0x161) - on every change, else every 2 s
Condition2011=1
; total cap of the 0.5.2 diagnostic lines
MaxLines=4000
; 0.5.3: read-only export TscTargeterSnapshot for TruMenu 0.13's thrall labels (targeter 9 buckets / rejected with the
; WHY result / target, the player's hit list, the last condition 2011). Needs Targeter9=1; the copy is built on the
; game thread only while TruMenu asks (labels on). 0 = the export answers "none"
Snapshot=1
[Damage]
; 0.6 (K14): the enemy damage function tru+0x237590 (TU 0x822f60e0). Its switch over the damage type ends at 16 on the
; PC; the title update goes to 27 (17 = nothing, 18..27 = damage + death check like 0, 1, 2 ...). Lara's DLC 2 attacks
; use 17..27, so on the PC those hits are dropped (no damage, no death / regenerate check).
; 1 = extend the switch exactly as the TU (bound 0x1b + the TU's 28-entry table owned by the plugin). Read again at
; run time at most once per second while hits come (needs Log=1 or Translate=1 at the start). 0.6.3: default 1 (a pure
; TU translation, live 07.11.: -40 per hit, the tutorial thralls die, the hall02 wall breaks); 0 = the PC switch
Translate=1
; 1 = count the incoming damage types per target and log them every 2 s while hits happen ("0.6 damage types: ...",
; with the verdict of the PC switch and of the TU's). Changes nothing in the game
Log=1
; total cap of the damage lines
MaxLines=3000
[Chunk]
; 0.6.1: an enemy whose LP is already <= 0 when Lara's hit impulse (message 0x91) arrives. Lara's contact callback
; sends it from INSIDE the physics step; the PC (= retail) then builds the chunkdoll at once and the locked step refuses
; its rigid bodies -> fatal "ChunkDoll: failed to create geom". The title update replaced that branch (TU 0x82305ba0):
; unless the enemy is already in a death state it is switched to Death (kind 7) and the Death state makes the chunkdoll
; in the enemy update, outside the step. 1 = as the TU (default), 0 = the PC branch. Read again at run time at most
; once per second when the branch is reached (needs Translate=1 or Log=1 at the start)
Translate=1
; 1 = one burst line every 2 s per enemy while it happens ("0.6.1 chunk: ..." with the physics lock at that moment and
; what the PC alone would have done). Changes nothing in the game
Log=1
; total cap of the chunk lines
MaxLines=2000
; 0.6.7 (K-7): at most 8 chunkdolls at a time as the title update (TU 0x82376700 `cmpwi r11, 8`; PC / retail 4 at
; tru+0x296fa8). Safe since the lethal impulse above (Translate=1) keeps the chunkdoll out of the physics step (live
; 09.11.: 5 such impulses caught, no crash). 0 = 4 (PC). Read at the start only. Default 1
Limit8=1
; 0.6.13 (Q99 option A, PC option - not a TU translation): every base / DLC 1 chunkdoll has one permanent piece (record
; #6, bit 0) that only loses its physics body after the lifetime (20 s) and stays for ever - also on the Xbox. 1 = the
; byte 0x696f69 `75 0f` -> `eb 0f`: that piece is removed after its lifetime like the others (old saved pieces come
; back at the next load and vanish 20 s later). 0 = the game's (retail / TU). Read again at run time (at most once per
; second). Default 0 (not played yet)
RemoveLastPiece=0
[Splash]
; 0.6.2 (K9): CombatManager::MeleeSplashDamage tru+0x2e68b0 as the title update (TU 0x823e1220 / area damage
; 0x8237ae88). 1 = (a) the main target of the hit (CombatManager+0x48) gets no extra splash hit - the area damage
; tru+0x29f1e0 skips it for this caller, as the TU (also outside doppelganger mode); (b) in doppelganger mode the splash
; type is remapped through object 858's pair table (0x1a -> 0x10, 0x10 -> 0x16) - only while the K14 switch is extended
; ([Damage] Translate=1), because 0x16 = 22 is a type only the TU switch accepts. 0 = the PC splash. Read again at run
; time at most once per second while splashes come (needs Translate=1 or Log=1 at the start). Default 1
Translate=1
; 1 = when object 858's pair table differs from the Xbox values (the converted file holds three of its four words
; unswapped), use the Xbox values {0x1a -> 0x10}, {0x10 -> 0x16} (DTP 22497 +0x1b0) and say so; 0 = the table as loaded
Fallback=1
; 1 = burst lines every 2 s while splashes happen ("0.6.2 splash: ..." with type in / out, main target, the verdict of
; the enemy switch). Changes nothing in the game
Log=1
; total cap of the splash lines
MaxLines=2000
[Death]
; 0.6.3 (P1a, T3): the enemy death check tru+0x220380 (TU 0x822f6578) - when a lethal hit lets the enemy
; regenerate (ShouldRegenerate yes) the title update sends script notification 33 (PlayNotification) before it
; puts the enemy into RegenerateDeath; hall02's level script answers with the finisher hint hint_17 (once).
; 1 = as the TU (notification 33, then the PC's EnterRegenerateDeath tru+0x282780 as before), 0 = no notification
; (PC). Read again at run time at most once per second when a lethal regenerate hit comes. Default 1. One log line
; per such hit ("0.6.3 death: ...", at most 1000). 0.6.5: also the 33 of T2 (TranslateLand) follows this key.
; 33, 34 and 38 belong together: 33 opens hall02's finisher hint, 34 / 38 close it again - 33 alone (0.6.3 / 0.6.4)
; leaves the hint hanging and blocks the punch / kick hint
TranslateNotify33=1
; 0.6.5 (P1d, H6): RegenerateDeath slot 12 (Exit, tru+0x27eeb0) as the TU 0x8235e338 - script notification 34 every
; time an enemy leaves RegenerateDeath (stands up or dies). 0 = PC. Live (<= 1 / s). Default 1
TranslateNotify34=1
; 0.6.5 (H7 / H8): the TU's first block of RegenerateDeath / Regenerate slot 10 (TU 0x8235e3a8 / 0x8235e998) - a hit
; (message 0x11c) of type 16 (or type 1 subtype 1) on a downed enemy with a companion: death switch kind 7 and script
; notification 38 (the finisher). 0 = PC message handlers. Live. Default 1
TranslateNotify38=1
; 0.6.5 (H1): ShouldRegenerate (tru+0x27f040, TU 0x8235ece8) asks the companion's regeneration list before the tune
; list (thrall extensions: one entry, type 2 Heavy) - a lethal heavy hit lets a thrall regenerate as on the Xbox.
; The three calls tru+0x2203e4 / +0x2824b9 / +0x2826d3 are patched, not the function. 0 = PC list only. Live. Default 1
TranslateRegenList=1
; 0.6.5 (H3 / H4 / H3b, T2): a thrall with a companion that lands with LP <= 0 gets notification 33 (if
; TranslateNotify33=1) and goes to RegenerateDeath instead of LandDeath (TU 0x82328d24); Land slot 13 lets
; RegenerateDeath / Death interrupt Land with a companion (TU 0x82329060); a lethal regenerate hit while in Land sends
; 33 but switches nothing (TU 0x822f6654) - the landing decides. 0 = PC Land. Live. Default 1
TranslateLand=1
; 0.6.6 (T5): lethal, not regenerating hit on an enemy with a companion -> death kind 7 at once (TU 0x823038d8). Live. Default 1
TranslateT5=1
; 0.6.6 (P1c): Vaulted Enter as the TU 0x8232b630 + step chain; step table only from fixed extension data. Live. Default 1
TranslateVaulted=1
; 0.6.6 (P1c K): Vaulted clock - 5 s without slow motion (needs TranslateVaulted). Live. Default 1
TranslateVaultedClock=1
; 0.6.9 (K-8 / melee kill): 1 = one line per chunkdoll build of the Death state ("0.6.9 chunk build: <enemy> ... record
; +0x46 <n> ... -> BUILT / not built; chunkdoll count [0xecfc70] a -> b, physics lock ...") and per death switch
; ("0.6.9 death switch: <enemy> kind <k> ... from <caller>, LP ..., state <before> -> <after> ..., request to
; brain+0x1254 accepted / al 0"); at most 2000. Changes nothing in the game. Live. Default 1
Log=1
[Companion]
; 0.6.5 (P1d, H0): the TU's companion instance of a thrall (TU 0x822da800 / 0x822da918) as a lookup: the first child
; object of the thrall's object with data type 0x3d (870 viking / tutorial viking, 932 yeti, 944 armoured yeti),
; read from the object table on every use, nothing kept. 0 = never a companion (= the TU without one = the PC for
; every part that asks for it). Live. Default 1
Translate=1
; 1 = one line per thrall instance the first time a 0.6.5 hook sees it ("0.6.5 companion: ... companion object 870 ...,
; byte +0x18 = 0, regeneration list count 1, entry 0 {2, 0, 0}" or "none: <reason>"; at most 400). Default 1
Log=1
[Melee]
; 0.6.4 (P1b, T-M1 / T-M2): the enemy state MeleeAttack as the title update. 1 = (T-M1) the messages 0x15 / 0x8a / 0xbe
; end the attack only when their data pointer is 0 (TU 0x82330d40; the animation-end message from the anim callback
; has data 0, so the normal end is unchanged), (T-M2) its Enter sets brain+0xc bit 0 when the attack record's flags
; (+8) have bit 2 clear (TU 0x8232fb48; on the PC only message 0xcb set that bit). 0 = nothing patched (PC = retail).
; Read at the start only. Log lines "0.6.4 melee: ..." (at most 300 per part). T-M3: TranslateInterrupt below. Default 1
Translate=1
; 0.6.5 (P1d, H5, T-M3): MeleeAttack slot 13 (tru+0x242f40) as the TU 0x82330830 - Vaulted and (with a companion)
; RegenerateDeath may also interrupt an attack. 0 = PC slot 13. Live (<= 1 / s). Default 1
TranslateInterrupt=1
[Hit]
; 0.6.7 (K-1): the hit structure of a hit on an enemy with a companion (thralls: extension 870 / 932 / 944) as the title
; update 0x82301dc0 - the companion's hit records (damage types 18..27 of Lara's DLC 2 melee, also 0 / 1 / 2 / 4) are
; searched before the PC table; on the PC types 18..27 get no structure at all, so the decision tru+0x223410 always takes
; the heavy reaction. Placed at the three selector calls (tru+0x223429 / +0x23b157 / +0x24f338; the last one only on the
; knockback path). 1 = as the TU, 0 = the PC selector. Live (<= 1 / s). Default 1
Translate=1
; 0.6.7: knockback force factor per damage type from the companion's hit record +0x40 (TU 0x822f77e4: 3 / 9 / 12 / 18,
; 3.0 without a record) instead of the fixed 3.0 (tru+0x220940 / +0x220971). 0 = always 3.0 (PC). Live. Default 1
TranslateKnockback=1
; 0.6.8 (K-1b): Lara's contact hit (sender tru+0x319050) sends the impulse message 0x91 after the hit message
; (tru+0x3192da); the title update 0x823e1870 skips it for targets with flag 0x400000 in [[inst+0x10]]+4 (enemies with a
; brain, the thrall too) - on the PC the impulse throws the thrall into Fall on every punch. 1 = as the TU (no impulse
; to flagged targets), 0 = the impulse to every target (PC). Live (<= 1 / s). Default 1
TranslateImpulseGate=1
; 0.6.10 (K-8b): Lara's contact hit gives the hit message msg+0x44 = (int) A+0x10 (attack force) and msg+0x48 = (int)
; A+0x14 as the title update 0x823e169c (tru+0x319169); the knockback tru+0x220650 runs with msg+0x44 when > 0, else
; with the record's s+0x30 - so types 21 / 26 (s+0x30 = 0) throw the thrall again. 1 = as the TU, 0 = 0 / 0 (PC).
; Live (<= 1 / s). Default 1
TranslateHitSpeed=1
; 1 = one line per hit decision ("0.6.7 hit: ... type <t> sub <msg+0x64> msg+0x54 <v> amount <a> msg+0x44 <v> msg+0x48
; <v> ... structure: companion record
; (TU) / PC table / no structure -> HEAVY / light"), per knockback ("0.6.7 knockback: ... force") and per skipped impulse
; ("0.6.8 impulse gate: ... impulse 0x91 not sent"). 0.6.9: also per contact of Lara's melee at the hit-list add
; tru+0x3190ad ("0.6.9 hit list: contact -> <enemy> at Lara record <n> ... -> added in slot k / REFUSED: already in slot
; k / list full ...; list +0xa4 [...]"; the same target / result / record again within 1 s is only counted). Changes
; nothing in the game. Live. Default 1
Log=1
; total cap of the hit lines
MaxLines=3000
[Adrenaline]
; 0.6.13 (Q108, read only, main game): TruShadowCombat.log lines "0.6.13 Q108 ..." - adrenaline meter full (CM+0x1fc
; bit 22), adrenaline mode on / off (bit 27, R3 = action 37), headshot window on / off (bit 21, set by the vault-off
; strike of state 1014), circle on / off (reticle bit 6), pointer in / out of the zone (bit 7, with pointer and radius),
; every slow motion start / end of the world or player time scale with its factor, one line per Vaulted Enter of an
; enemy (needs [Death] TranslateVaulted's stub, placed by default), per state 1014 enter (started or why not) and per
; strike shot (pointer in / out of the zone). A poll thread reads every 10 ms. Changes nothing. Start only. Default 1
Log=1
; 0.6.13 (Q109, accessibility, PC option): while the strike circle is up (reticle bit 6) the pointer is pulled to at
; most half the radius before the game's zone test (call 0x70d863 -> 0x6f2f20), so bit 7 ("in the grey zone") stays
; set and an RT shot during the window succeeds. 0 = the game's. Read again at run time (at most once per second).
; Default 0 (not played yet)
AssistPointer=0
; 0.6.14 (F6, PC option): the game fills the meter with the damage Lara deals - the enemy damage path posts message
; 0xd9 with (int)(LP before - LP after) to Lara (0x63b03a); nothing is added while the headshot window (bit 21) is open
; or the meter is held full (bit 22); maximum = player data +0x2d0 (500). This percent scales that amount at the post
; (0..1000, rounded). 100 = the game's. Read again at run time. Log: "0.6.14 F6 fill: ..." per post ([Adrenaline] Log)
FillPercent=100
; 0.6.14 (F6, PC option): the bar drains meter -= time x rate, rate = player data +0x2d4 (20 per second) or +0x2d8 (225
; per second, adrenaline mode / R3). These percents multiply the data values (0..1000, 0 = no drain). 100 = the data.
; Read again at run time
DrainPercent=100
DrainModePercent=100
; 0.6.14 (F6, PC option, accessibility): the vault-off strike (state 1014, slow-motion headshot) needs a full meter -
; condition 538 (CM+0x1fc bit 22) is the first condition of its only transition. 1 = condition 538 answers 1 in the
; main game (doppelganger mode keeps the TU meter flag), so the strike starts without a full meter (it empties the
; meter itself). Needs [Conditions] Enabled=1. 0 = the game's. Read again at run time
StrikeWithoutFullMeter=0
[Lock]
; 0.6.13 (Q68, PC option): the lock-on target switch 0x71cb10 adds the MOUSE axes (actions 0x10 / 0x11) to the right
; stick; a switch needs only |stick + mouse| >= 0.2 (player tuning +0x2a0), so moving the mouse while locked on jumps to
; another target. 0 = the mouse no longer switches targets (the camera keeps its own mouse input; the pad stick still
; switches as on the Xbox). 1 = the game's. Read again at run time (at most once per second). Default 1
MouseSwitch=1
; 0.6.13 (Q68): virtual-key codes (decimal; e.g. 88 = X, 67 = C, 0 = off) of keys that switch the locked target to the
; right / left: one frame of +1.0 / -1.0 on the mouse x input of the switch, the game's own threshold, search, repeat
; timers and sound do the rest; only while the game window has the focus. Read again at run time. Default 0 (off)
RightKey=0
LeftKey=0
